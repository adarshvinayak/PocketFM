  isOpen:function(){return document.getElementById('portal-root').classList.contains('is-open');}
};
window.PocketPortal={open:window.StoryPulsePortal.open,close:window.StoryPulsePortal.close,isOpen:window.StoryPulsePortal.isOpen,getEvents:function(){try{return document.getElementById('portal-frame').contentWindow.PocketPortal.getEvents();}catch(e){return [];}}};

  for(let i=0;i<sentences.length;i+=2) chunks.push(sentences.slice(i,i+2).join(" "));
  return chunks.length?chunks:[String(text||"")];
}

  return TTS_CACHE_VERSION+":"+hashStr(JSON.stringify({sid,text:turn.t,voice:cast.voice,persona:cast.persona,vd:turn.vd||""}));
}
function ttsDatabase(){
  if(ttsDatabasePromise) return ttsDatabasePromise;
  if(typeof indexedDB==="undefined") return Promise.resolve(null);
  ttsDatabasePromise=new Promise(resolve=>{
    try{
      const request=indexedDB.open(TTS_DB_NAME,1);
      request.onupgradeneeded=()=>request.result.createObjectStore(TTS_DB_STORE);
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>resolve(null);
    }catch(e){ resolve(null); }
  });
  return ttsDatabasePromise;
}
async function storedTTSBlob(key){
  const db=await ttsDatabase();
  if(!db) return null;
  return new Promise(resolve=>{
    try{
      const request=db.transaction(TTS_DB_STORE,"readonly").objectStore(TTS_DB_STORE).get(key);
      request.onsuccess=()=>resolve(request.result||null);
      request.onerror=()=>resolve(null);
    }catch(e){ resolve(null); }
  });
}
async function storeTTSBlob(key,blob){
  const db=await ttsDatabase();
  if(!db||!blob) return false;
  return new Promise(resolve=>{
    try{
      const transaction=db.transaction(TTS_DB_STORE,"readwrite");
      transaction.objectStore(TTS_DB_STORE).put(blob,key);
      transaction.oncomplete=()=>resolve(true);
      transaction.onerror=()=>resolve(false);
      transaction.onabort=()=>resolve(false);
    }catch(e){ resolve(false); }
  });
}
async function fetchTTSBlob(turn,sid){
  const cast=castFor(sid,turn.sp);
  try{
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),12000);
    const r=await fetch((window.OPENAI_PROXY_BASE||"")+"/api/openai?path=/v1/audio/speech",{
      method:"POST", signal:ctl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"gpt-4o-mini-tts",input:turn.t,voice:cast.voice,
        instructions:(cast.persona?cast.persona+" ":"")+(turn.vd||"Warm, cinematic audiobook narration."),response_format:"mp3"})
    });
    clearTimeout(timer);
    if(!r.ok) return null;
    return await r.blob();
  }catch(e){ return null; }
}
async function ttsGet(turn,sid){
  if(!liveAllowed()) return null;
  const c=TTSCACHE.get(turn.id);
  if(c){ if(c.url) return c.url; if(c.promise) return await c.promise; }
  const p=(async()=>{
    const key=ttsCacheKey(turn,sid);
    const stored=await storedTTSBlob(key);
    if(stored) return URL.createObjectURL(stored);
    const blob=await fetchTTSBlob(turn,sid);
    if(!blob) return null;
    // IndexedDB survives page reloads, so a completed Prepare series run is reusable.
    await storeTTSBlob(key,blob);
    return URL.createObjectURL(blob);
  })();
  TTSCACHE.set(turn.id,{promise:p});
  const url=await p;
  TTSCACHE.set(turn.id,{url});
  return url;
}
function warm(turns,sid){ // background prefetch, concurrency 4
  if(!liveAllowed()) return;
  for(const t of turns){ if(!TTSCACHE.has(t.id)) WARMQ.push({t,sid}); }
  const pump=async()=>{
    if(WARMBUSY>=WARM_CONCURRENCY) return;
    const job=WARMQ.shift(); if(!job) return;
    WARMBUSY++;
    try{ await ttsGet(job.t,job.sid); } finally { WARMBUSY--; pump(); }
  };
  for(let i=0;i<WARM_CONCURRENCY;i++) pump();
}

/* =====================================================================
   SFX ENGINE — disabled. StoryPulse now plays dialogue only.
===================================================================== */
const STORY_SFX_ENABLED = false;
const SFX = (()=>{
  let ctx=null, master=null, bedGainA=null, bedGainB=null, bedNodesA=[], bedNodesB=[];
  let activeBed="A", currentPreset=null, muted=false, duckLevel=1;
  let hbGain=null, hbCarrier=null, hbPulseGain=null, hbTimer=null, heartbeatOn=false;
  function ensure(){
    if(!STORY_SFX_ENABLED) return;
    if(ctx) return;
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      bedGainA=ctx.createGain(); bedGainA.gain.value=0; bedGainA.connect(master);
      bedGainB=ctx.createGain(); bedGainB.gain.value=0; bedGainB.connect(master);
      hbGain=ctx.createGain(); hbGain.gain.value=0; hbGain.connect(master);
    }catch(e){ ctx=null; }
  }
  const bedLevel=()=> muted?0:0.055*duckLevel; // ~-32dB baseline, ducked further under dialogue
  function buildBed(preset,gainNode){
    const nodes=[];
    if(preset==="tension"){
      [55,58.5].forEach(f=>{
        const o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.value=f;
        const g=ctx.createGain(); g.gain.value=0.5;
        o.connect(g); g.connect(gainNode); o.start(); nodes.push(o);
      });
    } else if(preset==="warm"){
      const noise=ctx.createBufferSource();
      const buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.3;
      noise.buffer=buf; noise.loop=true;
      const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=420;
      noise.connect(f); f.connect(gainNode); noise.start(); nodes.push(noise);
    } else { // cold
      const o=ctx.createOscillator(); o.type="sine"; o.frequency.value=880;
      const g=ctx.createGain(); g.gain.value=0.4;
      o.connect(g); g.connect(gainNode); o.start(); nodes.push(o);
    }
    return nodes;
  }
  function stopNodes(nodes){ nodes.forEach(n=>{ try{n.stop()}catch(e){} try{n.disconnect()}catch(e){} }); }
  function setBed(preset){
    ensure(); if(!ctx||!preset||preset===currentPreset) return;
    currentPreset=preset;
    const goingA=activeBed==="B";
    const inGain=goingA?bedGainA:bedGainB, outGain=goingA?bedGainB:bedGainA;
    const inNodes=buildBed(preset,inGain);
    if(goingA){ stopNodes(bedNodesA); bedNodesA=inNodes; } else { stopNodes(bedNodesB); bedNodesB=inNodes; }
    const now=ctx.currentTime;
    inGain.gain.cancelScheduledValues(now); inGain.gain.setValueAtTime(inGain.gain.value,now);
    inGain.gain.linearRampToValueAtTime(bedLevel(),now+1.5);
    outGain.gain.cancelScheduledValues(now); outGain.gain.setValueAtTime(outGain.gain.value,now);
    outGain.gain.linearRampToValueAtTime(0,now+1.5);
    activeBed=goingA?"A":"B";
  }
  function refreshBedLevel(){
    if(!ctx) return;
    const g=activeBed==="A"?bedGainA:bedGainB;
    const now=ctx.currentTime;
    g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value,now);
    g.gain.linearRampToValueAtTime(bedLevel(),now+0.3);
  }
  function duck(on){ duckLevel=on?0.4:1; refreshBedLevel(); } // ~-6dB under dialogue
  function setMuted(m){ muted=m; refreshBedLevel(); }
  function heartbeatIn(){
    ensure(); if(!ctx||heartbeatOn) return; heartbeatOn=true;
    hbCarrier=ctx.createOscillator(); hbCarrier.type="sine"; hbCarrier.frequency.value=55;
    hbPulseGain=ctx.createGain(); hbPulseGain.gain.value=0;
    hbCarrier.connect(hbPulseGain); hbPulseGain.connect(hbGain); hbCarrier.start();
    hbTimer=setInterval(()=>{
      if(!ctx) return;
      const now=ctx.currentTime, peak=muted?0:0.9*duckLevel;
      hbPulseGain.gain.cancelScheduledValues(now);
      hbPulseGain.gain.setValueAtTime(0,now);
      hbPulseGain.gain.linearRampToValueAtTime(peak,now+0.05);
      hbPulseGain.gain.linearRampToValueAtTime(0,now+0.35);
    },700);
    const now=ctx.currentTime;
    hbGain.gain.cancelScheduledValues(now); hbGain.gain.setValueAtTime(hbGain.gain.value,now);
    hbGain.gain.linearRampToValueAtTime(muted?0:0.55,now+2);
  }
  function heartbeatOut(){
    if(!ctx||!heartbeatOn) return; heartbeatOn=false;
    if(hbTimer){ clearInterval(hbTimer); hbTimer=null; }
    const now=ctx.currentTime;
    hbGain.gain.cancelScheduledValues(now); hbGain.gain.setValueAtTime(hbGain.gain.value,now);
    hbGain.gain.linearRampToValueAtTime(0,now+0.6);
    if(hbCarrier){ try{hbCarrier.stop(now+0.7)}catch(e){} hbCarrier=null; }
  }
  function sting(){
    ensure(); if(!ctx||muted) return;
    const now=ctx.currentTime;
    const noise=ctx.createBufferSource();
    const buf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
    noise.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1200; f.Q.value=0.8;
    const g=ctx.createGain(); g.gain.setValueAtTime(0,now);
    g.gain.linearRampToValueAtTime(0.22,now+0.03);
    g.gain.exponentialRampToValueAtTime(0.001,now+0.9);
    noise.connect(f); f.connect(g); g.connect(master); noise.start(now); noise.stop(now+0.9);
    const imp=ctx.createOscillator(); imp.type="sine";
    imp.frequency.setValueAtTime(120,now); imp.frequency.exponentialRampToValueAtTime(40,now+0.4);
    const ig=ctx.createGain(); ig.gain.setValueAtTime(0.3,now); ig.gain.exponentialRampToValueAtTime(0.001,now+0.5);
    imp.connect(ig); ig.connect(master); imp.start(now); imp.stop(now+0.5);
  }
  return {setBed,duck,setMuted,heartbeatIn,heartbeatOut,sting,get isMuted(){return muted;}};
})();

/* Turn player hook: plays a flattened turn list; studio (mp3, per-character
   voice) or local (synth, per-character pitch/rate) per turn. Inserts a
   500-800ms dramatic pause before any turn flagged beat:true. */
function useNarrator({segments,sid,onDone,autostart=false}){
  const [idx,setIdx]=useState(0);
  const [playing,setPlaying]=useState(false);
  const [paused,setPaused]=useState(false);
  const [tier,setTier]=useState(null);       // 'studio' | 'local'
  const [composing,setComposing]=useState(false);
  const [frac,setFrac]=useState(0);
  const [done,setDone]=useState(false);
  const ref=useRef({run:0,audio:null,int:null,paused:false});
  const onDoneRef=useRef(onDone); onDoneRef.current=onDone;

  const stopCurrent=useCallback(()=>{
    const r=ref.current; r.run++;
    if(r.audio){ try{r.audio.pause()}catch(e){} r.audio=null; }
    try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
    if(r.int){ clearInterval(r.int); r.int=null; }
  },[]);

  const playOne=useCallback((seg,my)=>new Promise(async(res)=>{
    const r=ref.current;
    if(seg.beat){
      await new Promise(z=>setTimeout(z,500+Math.round(Math.random()*300)));
      if(r.run!==my){ res(false); return; }
      SFX.sting();
    }
    let url=null;
    if(liveAllowed()){
      const cached=TTSCACHE.get(seg.id);
      if(cached&&cached.url){
        url=cached.url;
      }else{
        setComposing(true);
        const pending=cached&&cached.promise?cached.promise:ttsGet(seg,sid);
        // A prepared line is allowed to finish loading instead of being replaced by
        // the browser voice after three seconds. Unprepared lines still have a limit.
        const limit=cached&&cached.promise?15000:8000;
        url=await Promise.race([pending,new Promise(z=>setTimeout(()=>z("TIMEOUT"),limit))]);
        if(url==="TIMEOUT") url=null;
        setComposing(false);
      }
      if(r.run!==my){ res(false); return; }
    }
    const est=estMs(seg.t);
    let settled=false;
    const fin=ok=>{ if(settled)return; settled=true; if(r.int){clearInterval(r.int);r.int=null;} r.audio=null; res(ok); };
    if(url){
      setTier("studio");
      const a=new Audio(url); r.audio=a;
      a.onended=()=>fin(r.run===my);
      a.onerror=()=>fin(r.run===my);
      r.int=setInterval(()=>{
        if(r.run!==my){ try{a.pause()}catch(e){}; fin(false); return; }
        if(a.duration>0) setFrac(clamp(a.currentTime/a.duration,0,1));
      },200);
      a.play().catch(()=>fin(r.run===my));
      return;
    }
    setTier("local");
    const cast=castFor(sid,seg.sp);
    let spoke=false, elapsed=0;
    try{
      if(window.speechSynthesis){
        const u=new SpeechSynthesisUtterance(seg.t);
        u.rate=cast.fallback.rate; u.pitch=cast.fallback.pitch;
        const v=pickVoice(); if(v)u.voice=v;
        u.onend=()=>fin(r.run===my);
        u.onerror=()=>fin(r.run===my);
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
        spoke=true;
      }
    }catch(e){}
    r.int=setInterval(()=>{
      if(r.run!==my){ fin(false); return; }
      if(r.paused) return;
      elapsed+=200;
      setFrac(clamp(elapsed/est,0,1));
      if(!spoke && elapsed>=est) fin(true);
      if(spoke && elapsed>=est*2+5000) fin(true);   // watchdog: synth never fired
    },200);
  }),[sid]);

  const runFrom=useCallback(async(start)=>{
    stopCurrent();
    const my=ref.current.run;
    ref.current.paused=false;
    setPlaying(true); setPaused(false); setDone(false);
    for(let k=start;k<segments.length;k++){
      if(ref.current.run!==my) return;
      setIdx(k); setFrac(0);
      const ok=await playOne(segments[k],my);
      if(!ok) return;
    }
    if(ref.current.run===my){
      setPlaying(false); setFrac(1);
      setDone(true);
      onDoneRef.current && onDoneRef.current();
    }
  },[segments,playOne,stopCurrent]);

  const toggle=useCallback(()=>{
    const r=ref.current;
    if(!playing){ runFrom(idx>=segments.length-1&&done?0:idx); return; }
    if(!paused){
      r.paused=true; setPaused(true);
      if(r.audio){ try{r.audio.pause()}catch(e){} }
      else { try{ if(window.speechSynthesis) speechSynthesis.pause(); }catch(e){} }
    } else {
      r.paused=false; setPaused(false);
      if(r.audio){ r.audio.play().catch(()=>{}); }
      else { try{ if(window.speechSynthesis) speechSynthesis.resume(); }catch(e){} }
    }
  },[playing,paused,idx,done,segments.length,runFrom]);

  const restart=useCallback(()=>runFrom(0),[runFrom]);
  const skipNext=useCallback(()=>{
    if(!segments.length) return;
    if(idx>=segments.length-1){
      stopCurrent();
      setPlaying(false); setPaused(false); setIdx(segments.length-1); setFrac(1); setDone(true);
      onDoneRef.current && onDoneRef.current();
      return;
    }
    runFrom(idx+1);
  },[idx,segments.length,runFrom,stopCurrent]);

  useEffect(()=>{ if(autostart){ runFrom(0); } return stopCurrent; },[]);
  const progress=segments.length? clamp((idx+frac)/segments.length,0,1):0;
  return {idx,playing,paused,tier,composing,frac,progress,done,toggle,restart,skipNext};
}

/* =====================================================================
   GENERATIVE LAYER — OpenAI chat completions, JSON mode, silent fallback
===================================================================== */
async function llmJSON(system,user,timeoutMs=8000){
  if(!liveAllowed()) return null;
  try{
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),timeoutMs);
    const r=await fetch((window.OPENAI_PROXY_BASE||"")+"/api/openai?path=/v1/chat/completions",{
      method:"POST", signal:ctl.signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"gpt-4.1",temperature:0.85,
        response_format:{type:"json_object"},
        messages:[{role:"system",content:system},{role:"user",content:user}]})
    });
    clearTimeout(timer);
    if(!r.ok) return null;
    const j=await r.json();
    return JSON.parse(j.choices[0].message.content);
  }catch(e){ return null; }
}

    +"\nCANON RULES (immutable):\n- "+S.bible.rules.join("\n- ");
}
function protagonistPov(S){
  const name=S.id==="anklet"?"Bua":"Meera";
  return "POV RULE: "+name+" narrates this story in first-person past tense. Inside every in-story line, "+name+" is I/my/I'd, never you/your/you've. Do not address the listener or describe the listener's choice as if it happened to them.";
}
function stateBlock(c){
  const ch=c.choices.map(x=>"ep"+(x.epIndex+1)+": \""+x.label+"\" ("+x.canonStatus+")").join("; ")||"none yet";

    +"\nTraits: caution "+(c.traits.caution||0)+", aggression "+(c.traits.aggression||0)+", trust "+(c.traits.trust||0)
    +"\nClues held: "+(c.clues.join("; ")||"none")
    +"\nFlags: "+(c.flags.slice(-6).join("; ")||"none");

/* (B) open choice canon gate */
async function genGate(S,c,decision,text){
  const sys="You are the canon gatekeeper of an interactive audio drama. The main plot NEVER forks: every listener action is judged against immutable canon rules and bent back to the canonical spine. Respond ONLY with a JSON object: {\"intent\":\"short label (2-5 words)\",\"variables\":{\"action\":\"...\",\"approach\":\"...\",\"risk_level\":\"low|medium|high\"},\"canonStatus\":\"PASSED\"|\"REDIRECTED\",\"violatedRule\":\"the exact rule text, or null\",\"reconcileLine\":\"1-2 in-story lines showing the world naturally resisting or absorbing the action; written in the series narrative voice; NEVER address the listener; NEVER say 'not allowed'\",\"stateChanges\":[\"2-3 short displayable deltas\"],\"traits\":{\"caution\":0,\"aggression\":0,\"trust\":0}}. PASSED means the action is compatible with every canon rule AND can land at the required next position. Give exactly one trait a value of 1.";
  const usr=protagonistPov(S)+"\n\n"+bibleBlock(S)+"\n\n"+stateBlock(c)
    +"\n\nEPISODE CLOSING BEAT: "+segText(S.episodes.find(e=>e.decision&&e.decision.id===decision.id).segments.slice(-1)[0])
    +"\nREQUIRED NEXT POSITION (all paths must land here): "+decision.endPosition
    +"\n\nTHE LISTENER'S ACTION for "+decision.character+": \""+text+"\"";

}

/* Free-text fallback: keyword-map to the nearest authored option */
const KW={
  aggression:["burn","fire","break","attack","fight","smash","kill","force","confront","shout","destroy","kick","threaten","demand","accuse","trap","open","grab","stab","shoot","punch"],
  caution:["wait","hide","watch","lock","salt","careful","quiet","observe","listen","stay","note","record","study","search","check","plan","guard","bolt"],
  trust:["call","ask","tell","help","talk","share","rosa","meena","colonel","mother","tara","police","friend","together","confide","pray"]
};
function fallbackGate(S,decisionIndex,decision,text){
  const low=text.toLowerCase();
  const score={caution:0,aggression:0,trust:0};
  for(const k of TRAITS) for(const w of KW[k]) if(low.includes(w)) score[k]++;
  const domT=TRAITS.reduce((a,b)=>score[b]>score[a]?b:a,"caution");
  const intent=text.length>42?text.slice(0,40)+"…":text;

  // 1. Rule-aware guards: a canon violation must REDIRECT, whatever the trait reads.
  const guard=(S.guards||[]).find(g=>g.at.includes(decisionIndex)&&g.re.test(text));
  if(guard){
    const gTrait=Object.keys(guard.traits)[0];
    const redirected=decision.options.filter(o=>o.canonStatus==="REDIRECTED");
    const carrier=redirected.find(o=>Object.keys(o.traits)[0]===gTrait)||redirected[0]||decision.options[0];
    return {
      intent, variables:{action:text,approach:gTrait,risk_level:gTrait==="aggression"?"high":"medium"},
      canonStatus:"REDIRECTED", violatedRule:guard.rule, reconcileTurns:guard.reconcileTurns,
      stateChanges:guard.stateChanges, traits:guard.traits,
      mappedOptionId:carrier.id, live:false
    };
  }

  // 2. Otherwise map to the nearest authored option by trait.
  let best=null,bv=-1;
  for(const o of decision.options){
    const tr=Object.keys(o.traits)[0];
    const v=score[tr]||0;
    if(v>bv||(v===bv&&o.canonStatus==="PASSED")){bv=v;best=o;}
  }
  const tr=Object.keys(best.traits)[0];
  return {
    intent,
    variables:{action:text, approach:tr, risk_level:tr==="aggression"?"high":tr==="caution"?"low":"medium"},
    canonStatus:best.canonStatus,
    violatedRule:best.violatedRule||null,
    reconcileTurns:best.reconcileTurns,
    stateChanges:best.stateChanges,
    traits:best.traits,
    mappedOptionId:best.id,
    live:false
  };
}

function Waveform({on,color,bars=36,h=44}){
  const arr=useMemo(()=>Array.from({length:bars},(_,i)=>({
    h:22+Math.abs(Math.sin(i*0.71))*58+Math.abs(Math.sin(i*0.23))*20,
    d:(i*53)%900, du:700+((i*97)%500)

  return (
    <div className={"wf "+(on?"on":"")} style={{color,height:h}}>
      {arr.map((b,i)=><i key={i} style={{height:b.h+"%",animationDelay:b.d+"ms",animationDuration:b.du+"ms"}}/>)}
    </div>
  );
}

function allSegmentsForPrep(S){
  let segs=[];
  S.episodes.forEach((e,ei)=>{
    e.segments.forEach((s,i)=>{ segs=segs.concat(flattenTurns(s.turns,"ep:"+S.id+":"+ei+":"+i,"script")); });
    // Match InterludeBody's runtime prefix exactly; otherwise prepared interludes
    // look like cache misses and can fall back to the browser voice mid-series.
    if(e.decision) e.decision.options.forEach(o=>{ segs=segs.concat(flattenTurns(o.interlude.turns,"intlive:int:"+o.id,"interlude")); });
  });
  Object.entries(S.endings||{}).forEach(([key,ending])=>{
    segs=segs.concat(flattenTurns(ending.turns,"end:"+S.id+":"+key,"closing"));
  });
  (S.guards||[]).forEach((guard,index)=>{
    segs=segs.concat(flattenTurns(guard.reconcileTurns,"guard:"+S.id+":"+index,"redirect"));
  });
  if(S.teaser) segs=segs.concat(flattenTurns(S.teaser.turns,"teaser:"+S.id+":"+hashStr(segText(S.teaser)),"teaser"));
  return segs;
}

function buildSegments(S,ep,cb,closing){
  const e=S.episodes[ep];
  let segs=[];
  e.segments.forEach((s,i)=>{
    if(cb&&e.callbackIndex===i){
      const key=cb.key||hashStr(segText(cb));
      segs=segs.concat(flattenTurns(cb.turns,"cb:"+S.id+":"+ep+":"+key,"callback",cb.live));
    }
    segs=segs.concat(flattenTurns(s.turns,"ep:"+S.id+":"+ep+":"+i,"script"));
  });
  if(ep===3&&closing){
    const key=closing.key||hashStr(segText(closing));
    segs=segs.concat(flattenTurns(closing.turns,"end:"+S.id+":"+key,"closing",closing.live));
  }
  return segs;
}

function optionCounts(decision,sessionPicks){
  return decision.options.map(o=>({
    o, count:o.seed+sessionPicks.filter(p=>p.decisionId===decision.id&&p.optionId===o.id).length
  }));
}
function socialLine(decision,pickedId,sessionPicks){
  const rows=optionCounts(decision,sessionPicks);
  const total=rows.reduce((a,r)=>a+r.count,0);
  const freeN=decision.freeSeed.count+sessionPicks.filter(p=>p.decisionId===decision.id&&!p.optionId).length;
  if(pickedId==null){
    const pct=Math.max(1,Math.round(freeN/(total+freeN)*100));
    return "Only "+pct+"% of listeners wrote their own action. You're one of them.";
  }
  const plur=rows.reduce((a,b)=>b.count>a.count?b:a,rows[0]);
  const pct=Math.round(plur.count/total*100);
  return pct+"% of listeners chose "+plur.o.traitWord+". "+(plur.o.id===pickedId?"You're with them.":"You didn't.");
}
function DecisionScreen({S,ep,onChoose,onFree,busy}){

    if(!SR)return;
    if(listening){ try{recRef.current&&recRef.current.stop()}catch(e){} setListening(false); return; }
    try{
      const r=new SR(); recRef.current=r;
      r.lang="en-IN"; r.interimResults=false;
      r.onresult=ev=>{ setText(ev.results[0][0].transcript); setListening(false); };
      r.onend=()=>setListening(false);
      r.onerror=()=>setListening(false);
      r.start(); setListening(true);

  };

    <div className="min-h-screen flex justify-center px-5 py-8" style={{background:S.theme.playerBg}}>

/* Post-choice screen. Deliberately NEUTRAL: no verdict, no rule, no crowd stats.
   Those move to the "Your path" recap on the Series Complete screen. The canon
   gate still runs — the listener just isn't graded mid-story. */
function CanonCheck({S,verdict,onContinue}){
  const [shown,setShown]=useState(0);
  const total=verdict.stateChanges.length;
  useEffect(()=>{ SFX.sting(); },[]);
  useEffect(()=>{
    const timers=[];
    for(let i=1;i<=total+1;i++) timers.push(setTimeout(()=>setShown(i),350+i*420));
    const hold=(verdict.kind==="free"?4200:3200)+total*420;
    timers.push(setTimeout(onContinue,hold));
    return ()=>timers.forEach(clearTimeout);
  },[]);
  return (
    <div className="min-h-screen flex items-center justify-center px-5" style={{background:S.theme.playerBg}}>
      <div className="w-full max-w-md fadeup" onClick={onContinue} role="button" aria-label="Continue">
        <div className="rounded-2xl border border-line bg-panel/80 p-6 backdrop-blur">
          <Eyebrow color="#8B8FA0">Your move</Eyebrow>
          <div className="mt-3 mb-5 text-[15px]">Choice recorded: <span className="font-semibold">{verdict.label}</span></div>

          {verdict.kind==="free"&&
            <div className="mb-5 rounded-xl border border-line p-3.5 text-[12.5px] space-y-1.5 fadein">
              <div className="flex gap-2 items-center">
                <span className="text-muted uppercase text-[9.5px] tracking-[0.14em]">intent</span>
                <span className="font-medium">{verdict.intent}</span>

===================================================================== */
function InterludeScreen({S,ep,verdict,onContinue,onPortal}){
  const [scene,setScene]=useState(null);
  const d=S.episodes[ep].decision;
  useEffect(()=>{
    let dead=false;
    (async()=>{
      // A redirected choice opens with its reconcile beat — the world pushing back —
      // so the redirect plays as story here instead of as a verdict on the last screen.
      const leadTurns=(verdict.canonStatus==="REDIRECTED"&&verdict.reconcileTurns)?verdict.reconcileTurns:[];
      const gen=await genInterlude(S,verdict.canonRef,d,verdict.label);
      if(dead)return;
      if(gen){
        const genTurns=makeLiveTurns("narrator",gen.scene,gen.voiceDirection||"Intimate, close to the mic.");
        const allTurns=leadTurns.concat(genTurns);
        setScene({turns:allTurns,live:true,key:"live-"+hashStr(allTurns.map(t=>t.t).join(" "))});
      }else{
        const o=d.options.find(x=>x.id===(verdict.optionId||verdict.mappedOptionId))||d.options[0];
        const allTurns=leadTurns.concat(o.interlude.turns);
        setScene({turns:allTurns,live:false,key:"int:"+o.id+(leadTurns.length?":r"+hashStr(leadTurns.map(t=>t.t).join(" ")):"")});
      }
    })();
    return ()=>{dead=true};
  },[]);
  return (
    <div className="min-h-screen flex justify-center px-5 py-8" style={{background:"linear-gradient(180deg,#0B0A10 0%,#0F0D16 100%)"}}>
      <div className="w-full max-w-md fadeup">
        <div className="flex items-center gap-2.5 mb-1">
          <span className="w-1.5 h-1.5 rounded-full bg-indigo pulsedot"/>
          <Eyebrow color="#5B67D8">Private scene — generated for you</Eyebrow>
        </div>
        <p className="text-[11.5px] text-muted mb-8">No other listener hears this exact scene.</p>
        {!scene
          ? <p className="compose text-[13px] tracking-[0.1em] uppercase text-indigo mt-16 text-center">Composing your scene…</p>
          : <InterludeBody S={S} scene={scene} ep={ep} onContinue={onContinue} onPortal={onPortal}/>}
      </div>
    </div>
  );
}
function InterludeBody({S,scene,ep,onContinue,onPortal}){

          className="w-12 h-12 rounded-full bg-indigo text-white text-[15px] font-bold shrink-0 transition-transform active:scale-95">

        <div className="flex-1"><Waveform on={nar.playing&&!nar.paused} color={(cast&&cast.color)||"#5B67D8"} h={34}/></div>
        <TierBadge tier={nar.tier}/>

      <div className="h-0.5 rounded-full bg-white/10 overflow-hidden mb-8">
        <div className="h-full barfill bg-indigo" style={{width:Math.round(nar.progress*100)+"%"}}/>

      {decisions.map((d,di)=>{
        const mine=canon.choices.find(c=>c.decisionId===d.id);
        const rows=optionCounts(d,sessionPicks);
        const total=rows.reduce((a,r)=>a+r.count,0);
        const freeN=d.freeSeed.count+sessionPicks.filter(p=>p.decisionId===d.id&&!p.optionId).length;
        const wroteOwn=mine&&!mine.optionId;
        const pctOf=r=>Math.round(r.count/total*100);

        }else if(mine){
          const r=rows.find(x=>x.o.id===mine.optionId);

                    <div className="h-1.5 rounded-full bg-white/10 overflow-hidden">
                      <div className="h-full barfill rounded-full"
                        style={{width:p+"%",background:isMine?S.theme.accent:(o.canonStatus==="PASSED"?"#4B5468":"#333A4A")}}/>

        );
      })}

  );

/* =====================================================================
   WRITER STUDIO
===================================================================== */
function distFor(S,sessionPicks){
  return S.episodes.filter(e=>e.decision).map(e=>{
    const d=e.decision;
    const rows=optionCounts(d,sessionPicks).map(({o,count})=>({
      label:o.label,count,canon:o.canonStatus==="PASSED",optionId:o.id,
      picked:sessionPicks.some(p=>p.decisionId===d.id&&p.optionId===o.id)
    }));
    const total=rows.reduce((a,r)=>a+r.count,0);
    rows.forEach(r=>r.pct=Math.round(r.count/total*100));
    const sessFree=sessionPicks.filter(p=>p.decisionId===d.id&&!p.optionId);
    const intents=[...d.freeSeed.intents.map(([n,c])=>({n,c})),...sessFree.map(p=>({n:p.intent||"Custom action",c:1,now:true}))]
      .sort((a,b)=>b.c-a.c).slice(0,3);
    return {d,cliff:segText(e.segments[e.segments.length-1]),rows,free:d.freeSeed.count+sessFree.length,
            freeNow:sessFree.length>0,intents,ep:e.n};
  });
}

                    <span className="text-[#8A8676] shrink-0">{r.pct}% · {fmtNum(r.count)}</span>
                  </div>
                  <div className="h-2 rounded-full bg-[#EFEDE5] overflow-hidden">
                    <div className="h-full barfill rounded-full" style={{width:r.pct+"%",background:r.canon?S.theme.accent:"#C9C4B4"}}/>
                  </div>
                </div>)}
            </div>
            <div className="text-[12px] text-[#5C5850] mb-4">
              <span className="font-semibold">{fmtNum(x.free)} free-text choices</span>
              {x.freeNow&&<span className="ml-1.5 text-[9.5px] uppercase tracking-wider font-semibold" style={{color:"#5B67D8"}}>+1 just now</span>}
              <span className="text-[#8A8676]"> — top intents: </span>
              {x.intents.map((it,j)=><span key={j}>{j>0&&", "}<span className={it.now?"font-semibold text-[#5B67D8]":""}>{it.n} ({it.c})</span></span>)}
            </div>
            <div className="rounded-xl bg-[#F4F6FF] border border-[#DDE1F8] p-3.5">
              <div className="text-[9.5px] tracking-[0.16em] uppercase font-bold mb-1" style={{color:"#5B67D8"}}>What this means</div>
              {regen? <div className="shimmer h-9 rounded bg-[#E8EBFA]"/>
                : <p className="text-[13px] leading-relaxed">{lines[i]||x.d.insightFallback}{insights[sid]&&<span className="ml-2 align-middle"><LiveTag/></span>}</p>}
            </div>
          </section>)}

        <section className="bg-white rounded-2xl border border-[#E3E0D6] p-5 mb-4">
          <h3 className="font-display font-bold text-[17px] mb-1">Audience read</h3>
          <p className="text-[12px] text-[#8A8676] mb-4">How engaged listeners perceive {S.title.replace("The ","the ")}'s protagonist.</p>
          <div className="space-y-3 mb-5">
            {S.audienceRead.meters.map(([label,v])=>
              <div key={label} className="flex items-center gap-3 text-[13px]">
                <span className="w-40 shrink-0 text-[#5C5850]">{label}</span>
                <div className="flex-1 h-2 rounded-full bg-[#EFEDE5] overflow-hidden">
                  <div className="h-full barfill rounded-full" style={{width:v+"%",background:S.theme.accent}}/>
                </div>
                <span className="w-8 text-right text-[#8A8676]">{v}</span>
              </div>)}
          </div>
          <div className="text-[10px] tracking-[0.14em] uppercase text-[#8A8676] mb-2 font-semibold">Recommendations</div>
          <ul className="space-y-1.5">
            {S.audienceRead.recs.map((r,i)=><li key={i} className="text-[13px] leading-relaxed flex gap-2"><span style={{color:S.theme.accent}}>▸</span>{r}</li>)}
          </ul>
        </section>

        <StudioTeaser S={S} dists={dists} teaser={teasers[sid]} setTeaser={t=>setTeasers(p=>({...p,[sid]:t}))}/>

        <footer className="text-[11.5px] text-[#8A8676] leading-relaxed pb-6 text-center">
          Signals reflect engaged listeners and the options offered. Use them to know when to satisfy expectation — and when to deliberately subvert it.
        </footer>
      </div>
    </div>
  );
}

/* =====================================================================
   APP
===================================================================== */
function PortalHook({onEnter,onSkip}){
  const [remaining,setRemaining]=useState(13612);
  useEffect(()=>{const t=setInterval(()=>setRemaining(x=>Math.max(0,x-1)),1000);return()=>clearInterval(t);},[]);
  const clock=String(Math.floor(remaining/3600)).padStart(2,'0')+':'+String(Math.floor(remaining%3600/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
  return <section className="portal-hook"><div className="portal-hook-card"><div className="text-[10px] tracking-[.22em] uppercase text-[#c5b598]">The portal is open</div><div className="portal-hook-line"/><h1>The night isn't over.<span>Walk the house. Ask them yourself.</span></h1><p className="portal-presence"><i/>1,284 listeners inside</p><p className="text-[11px] text-[#b7af9f] mt-3">Three questions each. They only know what you know.</p><p className="mt-5 text-[12px] tracking-[.14em] uppercase text-[#d8a94e]">Closes in {clock}</p><button className="portal-step" onClick={onEnter}>Step inside</button><button className="portal-skip" onClick={onSkip}>Continue to Episode 3</button></div></section>;
}
function PortalReturn({vote,onContinue}){const pct=(window.PORTAL_WORLD&&window.PORTAL_WORLD.portalRitual&&window.PORTAL_WORLD.portalRitual.voteDistribution[vote])||48;return <section className="portal-return"><div className="portal-return-card"><div className="text-[10px] tracking-[.18em] uppercase text-[#d8a94e]">The house remembers</div><h1>You came out of that house believing it was {vote||'someone close'}.</h1>{vote&&<p className="text-[14px] text-muted">{pct}% of listeners agree with you.</p>}<button onClick={onContinue}>Begin Episode 3</button></div></section>}
function newCanon(){
  return {choices:[],traits:{caution:0,aggression:0,trust:0},clues:[],flags:[],
          nextEp:0,completed:false,path:null,closing:null,callbacks:{}};
}
function App(){
  const [view,setView]=useState({name:"dash"});
  const [canon,setCanonState]=useState({hollow:newCanon(),anklet:newCanon()});
  const canonRef=useRef(canon); canonRef.current=canon;
  const [sessionPicks,setSessionPicks]=useState([]);
  const sessionRef=useRef(sessionPicks); sessionRef.current=sessionPicks;
  const [preps,setPreps]=useState({});
  const [busyGate,setBusyGate]=useState(false);
  const [insights,setInsights]=useState({});
  const [teasers,setTeasers]=useState({});
  const [portalAvailable,setPortalAvailable]=useState(false);
  useEffect(()=>{const close=e=>{setPortalAvailable(true);setView({name:"portalreturn",vote:e.detail&&e.detail.vote});};window.addEventListener('storypulse:portal-closed',close);return()=>window.removeEventListener('storypulse:portal-closed',close);},[]);

  async function enterEpisode(sid,ep){
    const S=getSeries(sid);
    const c=canonRef.current[sid];
    let cb=null;
    if(ep>0&&S.episodes[ep].callbackIndex!=null){
      if(c.callbacks[ep]) cb=c.callbacks[ep];
      else{
        const prior=c.choices[c.choices.length-1];
        if(prior){
          const line=await genCallback(S,c,ep);
          const key=prior.optionId||prior.mappedOptionId;
          cb=line?{turns:makeLiveTurns("narrator",line,S.cbVd),live:true,key:"live-"+hashStr(line)}
                :{turns:S.episodes[ep].callbacks[key].turns,live:false,key};
        }
      }
    }
    let closing=c.closing;
    if(ep===3&&!closing){
      const gen=await genEnding(S,c);
      const dom=dominantTrait(c.traits);
      closing=gen?{turns:makeLiveTurns("narrator",gen.closingScene,gen.voiceDirection||S.endings[dom].vd),live:true,key:"live-"+hashStr(gen.closingScene)}
                 :{turns:S.endings[dom].turns,live:false,key:dom};
    }
    setCanonState(p=>({...p,[sid]:{...p[sid],
      callbacks:cb?{...p[sid].callbacks,[ep]:cb}:p[sid].callbacks,
      closing:closing||p[sid].closing}}));
    setView({name:"player",sid,ep,cb,closing});
  }

  function onEpisodeEnd(sid,ep){
    const S=getSeries(sid);
    if(S.episodes[ep].decision){ setView({name:"decision",sid,ep}); return; }
    setCanonState(p=>({...p,[sid]:{...p[sid],completed:true,path:dominantTrait(p[sid].traits)}}));
    setView({name:"complete",sid});
  }

  function finishChoice(sid,ep,d,verdict){
    const c=canonRef.current[sid];
    const nt={...c.traits};
    for(const k in (verdict.traits||{})) nt[k]=(nt[k]||0)+(verdict.traits[k]||0);
    const clues=[...c.clues], flags=[...c.flags];
    (verdict.stateChanges||[]).forEach(sc=>{
      if(/^new (clue|proof):/i.test(sc)) clues.push(sc.replace(/^new (clue|proof):\s*/i,""));
      else flags.push(sc);
    });
    const newC={...c,
      choices:[...c.choices,{epIndex:ep,decisionId:d.id,label:verdict.label,optionId:verdict.optionId,
        mappedOptionId:verdict.mappedOptionId,canonStatus:verdict.canonStatus,traits:verdict.traits,
        intent:verdict.kind==="free"?(verdict.intent||verdict.label):null}],
      traits:nt,clues,flags,nextEp:ep+1};
    setCanonState(p=>({...p,[sid]:newC}));
    verdict.canonRef=newC;
    verdict.social=socialLine(d,verdict.optionId,sessionRef.current);
    setSessionPicks(p=>[...p,{decisionId:d.id,optionId:verdict.optionId,
      intent:verdict.kind==="free"?verdict.intent:null,seriesId:sid}]);
    window.STORYPULSE_EVENTS.push({surface:"episode",type:"choice",seriesId:sid,episode:ep+1,value:verdict.label,ts:new Date().toISOString()});
    setView({name:"check",sid,ep,verdict});
  }

  function onChoose(sid,ep,option){
    const d=getSeries(sid).episodes[ep].decision;
    finishChoice(sid,ep,d,{kind:"authored",label:option.label,optionId:option.id,mappedOptionId:null,
      canonStatus:option.canonStatus,violatedRule:option.violatedRule||null,reconcileTurns:option.reconcileTurns,
      stateChanges:option.stateChanges,traits:option.traits,live:false});
  }

  async function onFree(sid,ep,text){
    setBusyGate(true);
    const S=getSeries(sid), d=S.episodes[ep].decision, c=canonRef.current[sid];
    const res=await genGate(S,c,d,text);
    let verdict;
    if(res){
      const tr=res.traits||{};
      const domT=TRAITS.reduce((a,b)=>(tr[b]||0)>(tr[a]||0)?b:a,"caution");
      const mapped=d.options.find(o=>Object.keys(o.traits)[0]===domT)||d.options[0];
      verdict={kind:"free",label:text,optionId:null,mappedOptionId:mapped.id,
        intent:res.intent||text.slice(0,40),variables:res.variables||{action:text},
        canonStatus:res.canonStatus,violatedRule:res.violatedRule||null,
        reconcileTurns:res.reconcileLine?makeLiveTurns("narrator",res.reconcileLine,S.cbVd):mapped.reconcileTurns,
        stateChanges:(res.stateChanges&&res.stateChanges.length)?res.stateChanges:mapped.stateChanges,
        traits:Object.keys(tr).length?tr:mapped.traits, live:true};
    }else{
      verdict={kind:"free",label:text,optionId:null,...fallbackGate(S,ep,d,text)};
    }
    setBusyGate(false);
    finishChoice(sid,ep,d,verdict);
  }

  async function prepare(sid){
    const S=getSeries(sid);
    if(!liveAllowed()){
      setPreps(p=>({...p,[sid]:{note:"Local voice mode — nothing to prepare. The demo runs instantly offline."}}));
      setTimeout(()=>setPreps(p=>({...p,[sid]:null})),4200);
      return;
    }
    const segs=allSegmentsForPrep(S);
    const todo=segs.filter(s=>{ const cached=TTSCACHE.get(s.id); return !cached||!cached.url; });
    if(!todo.length){
      setPreps(p=>({...p,[sid]:{note:"All "+segs.length+" voices are already cached."}}));
      setTimeout(()=>setPreps(p=>({...p,[sid]:null})),3600);
      return;
    }
    const already=segs.length-todo.length;
    let done=already;
    const t0=Date.now();
    setPreps(p=>({...p,[sid]:{running:true,done,total:segs.length,eta:null}}));
    for(let i=0;i<todo.length;i+=WARM_CONCURRENCY){
      await Promise.all(todo.slice(i,i+WARM_CONCURRENCY).map(s=>ttsGet(s,S.id)));
      done=Math.min(segs.length,done+WARM_CONCURRENCY);
      const doneNow=done-already, elapsed=(Date.now()-t0)/1000;
      const eta=doneNow>0?Math.round((elapsed/doneNow)*(todo.length-doneNow)):null;
      setPreps(p=>({...p,[sid]:{running:true,done,total:segs.length,eta}}));
    }
    const ready=segs.filter(s=>{ const cached=TTSCACHE.get(s.id); return cached&&cached.url; }).length;
    if(ready!==segs.length){
      setPreps(p=>({...p,[sid]:{note:ready+" of "+segs.length+" voices are ready. The remaining lines could not be prepared; retry to use studio voice for them."}}));
      setTimeout(()=>setPreps(p=>({...p,[sid]:null})),5200);
      return;
    }
    setPreps(p=>({...p,[sid]:{note:"Series ready — "+segs.length+" voices cached."}}));
    setTimeout(()=>setPreps(p=>({...p,[sid]:null})),4200);
  }

  function startSeries(sid){
    const c=canonRef.current[sid];
    if(c.completed){
      setCanonState(p=>({...p,[sid]:newCanon()}));
      canonRef.current={...canonRef.current,[sid]:newCanon()};
      enterEpisode(sid,0);
    } else enterEpisode(sid,c.nextEp);
  }

  const v=view;
  if(v.name==="studio")
    return <Studio canon={canon} sessionPicks={sessionPicks} insights={insights} setInsights={setInsights}
      teasers={teasers} setTeasers={setTeasers} onBack={()=>setView({name:"dash"})}/>;
  if(v.name==="player"){
    const S=getSeries(v.sid);
    return <PlayerScreen key={v.sid+"-"+v.ep} S={S} ep={v.ep} cb={v.cb} closing={v.closing} canon={canon[v.sid]}
      onEnd={()=>onEpisodeEnd(v.sid,v.ep)} onBack={()=>setView({name:"dash"})} portalOpen={portalAvailable&&v.sid==="anklet"} onPortalOpen={()=>setView({name:"portalprompt"})}/>;
  }
  if(v.name==="decision")
    return <DecisionScreen key={v.sid+"-"+v.ep} S={getSeries(v.sid)} ep={v.ep} busy={busyGate}
      onChoose={o=>onChoose(v.sid,v.ep,o)} onFree={t=>onFree(v.sid,v.ep,t)}/>;
  if(v.name==="check")
    return <CanonCheck key={v.verdict.label} S={getSeries(v.sid)} verdict={v.verdict}
      onContinue={()=>setView({name:"interlude",sid:v.sid,ep:v.ep,verdict:v.verdict})}/>;
  if(v.name==="interlude")
    return <InterludeScreen key={v.sid+"-"+v.ep} S={getSeries(v.sid)} ep={v.ep} verdict={v.verdict}
      onContinue={()=>enterEpisode(v.sid,v.ep+1)} onPortal={v.sid==="anklet"&&v.ep===1?()=>setView({name:"portalprompt"}):null}/>;
  if(v.name==="portalprompt")
    return <PortalHook onEnter={()=>{setPortalAvailable(true);window.StoryPulsePortal.open(2);}} onSkip={()=>{setPortalAvailable(true);enterEpisode("anklet",2);}}/>;
  if(v.name==="portalreturn") return <PortalReturn vote={v.vote} onContinue={()=>enterEpisode("anklet",2)}/>;
  if(v.name==="complete")
    return <CompleteScreen S={getSeries(v.sid)} canon={canon[v.sid]} sessionPicks={sessionPicks}
      onReplay={()=>startSeries(v.sid)} onHome={()=>setView({name:"dash"})}/>;
  return <Dashboard canon={canon} preps={preps} onPlay={startSeries} onPrepare={prepare}
    onStudio={()=>setView({name:"studio"})}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
