<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A10">
<title>Pocket Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#D8A94E; --maroon:#7B2B2B; --cream:#EDE9DE; --ink:#0B0A10; --panel:#14131C; --line:#26242F; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);
    font-family:Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
  #app{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}

  #stage{
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
    background:#000; overflow:hidden;
    box-shadow:0 0 80px rgba(0,0,0,.7);
  }
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter .35s ease, transform .35s ease;}

  .vignette{position:absolute;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(0,0,0,.6) 100%);}
  .grain{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.05;mix-blend-mode:overlay;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/></filter><rect width="180" height="180" filter="url(%23n)"/></svg>');}

  /* FIX: layers span the whole stage, so they must not eat clicks themselves.
     Only their interactive children opt back in via pointer-events:auto. */
  #sprites-layer{position:absolute;inset:0;z-index:2;pointer-events:none;}
  #hotspots-layer{position:absolute;inset:0;z-index:3;pointer-events:none;}
  #editor-overlay{position:absolute;inset:0;z-index:5;pointer-events:none;display:none;}
  #ui-layer{position:absolute;inset:0;z-index:4;pointer-events:none;}
  #fade-overlay{position:absolute;inset:0;z-index:6;background:#000;opacity:0;pointer-events:none;transition:opacity .3s ease;}
  #entry-card{position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8%; background:#09090b; color:var(--cream); cursor:pointer; opacity:0; pointer-events:none;
    transition:opacity .65s ease;}
  #entry-card.is-visible{opacity:1; pointer-events:auto;}
  #entry-card.is-leaving{opacity:0; pointer-events:none;}
  .entry-card-copy{max-width:900px; text-align:center; display:flex; flex-direction:column; align-items:center;}
  .entry-card-line{margin:0; opacity:0; transform:translateY(12px); animation:entryLine .7s ease forwards;}
  .entry-card-kicker{margin-bottom:25px; color:rgba(237,233,222,.54); font-size:11px; font-weight:700; letter-spacing:.23em; text-transform:uppercase; animation-delay:.2s;}
  .entry-card-main{font-family:Fraunces,Georgia,serif; font-size:clamp(29px,4.3vw,58px); font-weight:500; line-height:1.16;}
  .entry-card-main.first{animation-delay:.65s;}
  .entry-card-main.second{margin-top:13px; animation-delay:1.45s;}
  .entry-card-instruction{margin-top:29px; color:rgba(237,233,222,.61); font-size:clamp(11px,1.35vw,15px); letter-spacing:.11em; line-height:1.5; animation-delay:2.65s;}
  .entry-card-skip{position:static; width:72px; height:72px; margin-top:34px; display:grid; place-items:center;
    border:1px solid rgba(237,233,222,.32); border-radius:50%; background:rgba(255,255,255,.03); color:var(--cream);
    font:400 54px/1 Georgia,serif; cursor:pointer; transition:background .18s ease, transform .18s ease;}
  .entry-card-skip:hover,.entry-card-skip:focus-visible{background:rgba(216,169,78,.18); transform:translateX(2px); outline:1px solid rgba(216,169,78,.8); outline-offset:3px;}
  @keyframes entryLine{to{opacity:1; transform:none;}}

  /* ---------------- Sprites ---------------- */
  .sprite{
    position:absolute; transform:translateX(-50%); pointer-events:auto;
    cursor:pointer; outline:none;
  }
  .sprite img{
    display:block; height:100%; width:auto; pointer-events:none;
    filter:drop-shadow(0 0 0 rgba(216,169,78,0)) brightness(1);
    transform:scale(1); transform-origin:bottom center;
    transition:filter .2s ease, transform .2s ease;
  }
  .sprite:hover img, .sprite:focus-visible img{
    filter:drop-shadow(0 6px 22px rgba(216,169,78,.75)) brightness(1.08);
    transform:scale(1.02);
  }
  .sprite .label-pill{
    position:absolute; left:50%; bottom:100%; transform:translateX(-50%); margin-bottom:8px;
    white-space:nowrap; background:rgba(11,10,16,.82); color:var(--cream);
    font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
    padding:5px 11px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .15s ease; border:1px solid rgba(216,169,78,.4);
  }
  .sprite:hover .label-pill, .sprite:focus-visible .label-pill{opacity:1;}
  .talk-prompt{display:none; position:absolute; left:50%; top:50%; z-index:3; transform:translate(-50%,-50%);
    border:1px solid rgba(216,169,78,.9); border-radius:999px; padding:9px 16px; background:rgba(11,10,16,.92);
    color:var(--cream); font:700 12px Inter,system-ui,sans-serif; letter-spacing:.1em; text-transform:uppercase; box-shadow:0 6px 18px rgba(0,0,0,.5);}
  body.no-hover .sprite.talk-ready img{filter:drop-shadow(0 0 20px rgba(216,169,78,.9)) brightness(1.13); transform:scale(1.025);}
  .sprite .pulse-ring{
    display:none; position:absolute; left:50%; bottom:-3%; width:16%; aspect-ratio:1/1;
    transform:translateX(-50%); border-radius:50%; border:2px solid rgba(216,169,78,.65);
    animation:ringPulse 1.8s ease-out infinite; pointer-events:none;
  }
  body.no-hover .sprite .pulse-ring{display:block;}

  @keyframes ringPulse{
    0%{transform:translateX(-50%) scale(.8);opacity:.85;}
    75%{transform:translateX(-50%) scale(1.25);opacity:0;}
    100%{opacity:0;}
  }

  /* ---------------- Hotspots (objects + exits) ---------------- */
  .hotspot{position:absolute; cursor:pointer; border-radius:10px; outline:none; pointer-events:auto;}
  .hotspot .dot{
    position:absolute; left:50%; top:50%; width:9px; height:9px; border-radius:50%;
    transform:translate(-50%,-50%); background:var(--gold);
    box-shadow:0 0 10px rgba(216,169,78,.7);
    animation:dotPulse 2.5s ease-in-out infinite;
  }
  @keyframes dotPulse{0%,100%{opacity:.35;}50%{opacity:.75;}}

  .hotspot:hover, .hotspot:focus-visible{
    box-shadow:0 0 0 1px rgba(216,169,78,.9), inset 0 0 22px rgba(216,169,78,.22);
  }
  .hotspot .label-pill{
    position:absolute; left:100%; top:50%; transform:translateY(-50%); margin-left:10px;
    white-space:nowrap; background:rgba(11,10,16,.85); color:var(--cream);
    font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
    padding:5px 11px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .15s ease; border:1px solid rgba(216,169,78,.4);
  }
  .hotspot:hover .label-pill, .hotspot:focus-visible .label-pill{opacity:1;}
  .hotspot.flip .label-pill{left:auto; right:100%; margin-left:0; margin-right:10px;}

  .exit-hotspot .chevron{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:34px; color:var(--gold); text-shadow:0 0 14px rgba(216,169,78,.65);
    opacity:.6; pointer-events:none;
  }
  .exit-hotspot.dir-right .chevron{animation:chevronRight 1.6s ease-in-out infinite;}
  .exit-hotspot.dir-left .chevron{animation:chevronLeft 1.6s ease-in-out infinite;}
  @keyframes chevronRight{0%,100%{opacity:.5;transform:translate(-50%,-50%);}50%{opacity:1;transform:translate(calc(-50% + 6px),-50%);}}
  @keyframes chevronLeft{0%,100%{opacity:.5;transform:translate(-50%,-50%);}50%{opacity:1;transform:translate(calc(-50% - 6px),-50%);}}

  /* ---------------- UI chrome ---------------- */
  .ui-pill{
    pointer-events:auto; background:rgba(11,10,16,.78); border:1px solid rgba(216,169,78,.35);
    border-radius:12px; padding:12px 18px; backdrop-filter:blur(3px);
    box-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  .ui-top-left{position:absolute; top:3%; left:3%; max-width:64%;}
  .ui-top-left .title{font-family:Fraunces,Georgia,serif; font-weight:700; font-size:clamp(22px,4vw,38px); line-height:1.05;}
  .ui-top-left .subtitle{margin-top:5px; font-size:clamp(11px,1.5vw,15px); letter-spacing:.14em; text-transform:uppercase; color:rgba(237,233,222,.72);}
  .ui-top-right{position:absolute; top:3%; right:3%;}
  .ui-top-right .countdown{font-variant-numeric:tabular-nums; font-size:clamp(15px,2.2vw,21px); letter-spacing:.08em; color:var(--gold); font-weight:700;}
  .ui-top-right .countdown.is-amber{color:#e0a85c;}
  .ui-top-right .countdown.is-urgent{animation:countdownPulse 1.35s ease-in-out infinite;}
  @keyframes countdownPulse{50%{opacity:.5; transform:scale(1.025);}}
  .window-label{margin-top:5px; max-width:240px; color:rgba(237,233,222,.48); font-size:9px; line-height:1.25; letter-spacing:.07em; text-transform:uppercase;}
  .presence{position:absolute; top:calc(3% + 58px); left:3%; display:flex; align-items:center; gap:7px; color:rgba(237,233,222,.62); font-size:10px; letter-spacing:.07em; text-transform:uppercase;}
  .presence-dot{width:7px; height:7px; border-radius:50%; background:var(--gold); animation:presencePulse 2.6s ease-in-out infinite;}
  @keyframes presencePulse{50%{opacity:.35; transform:scale(.72);}}
  .ui-bottom-left{position:absolute; bottom:3%; left:3%;}
  .ui-bottom-left .room-name{font-size:clamp(14px,2vw,19px); font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:rgba(237,233,222,.9);}
  .ui-bottom-right{position:absolute; bottom:3%; right:3%;}
  .ui-bottom-right .clue-count{font-size:clamp(14px,2vw,19px); font-weight:600; letter-spacing:.08em; text-transform:uppercase; border:0; padding:0; background:transparent; color:var(--cream); cursor:pointer;}
  .ui-bottom-right .clue-count b{color:var(--gold); font-size:1.1em;}
  .entry-replay{position:absolute; top:calc(3% + 58px); right:3%; width:38px; height:38px; padding:0; display:grid; place-items:center;
    color:var(--cream); font:700 17px/1 Fraunces,Georgia,serif; cursor:pointer;}
  .voice-warm-status{position:absolute; top:calc(3% + 108px); right:3%; color:rgba(237,233,222,.55); font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:0; transition:opacity .35s ease;}
  .voice-warm-status.is-warming{opacity:1;}
  #voice-mute{position:absolute; top:calc(3% + 132px); right:3%; width:38px; height:34px; padding:0; display:grid; place-items:center; cursor:pointer;}
  #voice-mute svg,.conversation-mute svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  #voice-mute.is-muted,.conversation-mute.is-muted{color:rgba(237,233,222,.45);}

  /* ---------------- exit button (replaces a hotspot box for asButton exits) ---------------- */
  #exit-buttons{position:absolute; left:0; right:0; bottom:3%; display:flex; justify-content:center; gap:12px; pointer-events:none; z-index:4;}
  .exit-btn{
    pointer-events:auto; cursor:pointer; font-family:Inter,system-ui,sans-serif;
    background:rgba(11,10,16,.82); border:1px solid rgba(216,169,78,.5); color:var(--cream);
    border-radius:999px; padding:13px 26px; font-size:clamp(13px,1.7vw,16px); font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; display:flex; align-items:center; gap:10px;
    box-shadow:0 6px 22px rgba(0,0,0,.45); transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .exit-btn:hover{background:rgba(216,169,78,.18); border-color:rgba(216,169,78,.85); transform:translateY(-1px);}
  .exit-btn .chev{color:var(--gold); font-size:1.2em; line-height:1;}

  /* ---------------- Modal panels ---------------- */
  /* FIX: the container is always in the DOM, so it must be click-through when
     empty. The backdrop it holds turns pointer events back on. */
  #modal-root{position:fixed;inset:0;z-index:20;pointer-events:none;}
  .modal-backdrop{
    position:absolute;inset:0; background:rgba(6,5,9,.72); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:5vh 5vw;
    animation:fadeIn .2s ease both; pointer-events:auto;
  }
  .modal-backdrop.object-examine-backdrop{background:rgba(6,5,9,.5); backdrop-filter:blur(6px) brightness(.5);}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .panel{
    position:relative; width:min(520px,92vw); max-height:82vh; overflow:auto;
    background:linear-gradient(160deg, rgba(28,18,20,.97), rgba(11,10,16,.97));
    border:1px solid rgba(216,169,78,.35); border-radius:16px; padding:32px 28px 28px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    animation:panelIn .25s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
  .panel .close-btn{
    position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%;
    border:1px solid rgba(216,169,78,.35); background:rgba(255,255,255,.03); color:var(--cream);
    font-size:14px; cursor:pointer; line-height:1;
  }
  .panel .close-btn:hover{background:rgba(216,169,78,.15);}
  .panel .eyebrow{font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-weight:600;}
  .panel h2{font-family:Fraunces,Georgia,serif; font-weight:700; font-size:26px; margin:8px 0 14px;}
  .panel p{font-size:14.5px; line-height:1.7; color:rgba(237,233,222,.9); white-space:pre-line;}
  .panel .maroon-rule{height:2px; width:36px; background:var(--maroon); margin:2px 0 14px; border-radius:2px;}
  .evidence-examine{display:grid; grid-template-columns:minmax(132px,40%) minmax(0,1fr); gap:20px; align-items:center;}
  .evidence-examine.no-model{display:block;}
  .evidence-model-wrap{min-width:0; text-align:center;}
  .evidence-model{width:100%; height:clamp(142px,25vh,190px); border:1px solid rgba(216,169,78,.2); border-radius:10px;
    background:radial-gradient(ellipse at 50% 48%, rgba(123,43,43,.12), transparent 66%); touch-action:none; cursor:grab; overflow:hidden;}
  .evidence-model:active{cursor:grabbing;}
  .evidence-model canvas{display:block; width:100%; height:100%; outline:none;}
  .evidence-caption{margin-top:8px; color:rgba(216,169,78,.66); font:700 9px/1 Inter,system-ui,sans-serif; letter-spacing:.2em; text-transform:uppercase;}
  .evidence-copy{min-width:0;}
  .evidence-copy .maroon-rule{margin-top:2px;}
  .object-examine-panel{width:min(640px,92vw);}
  .object-examine-copy{min-height:88px; font-family:Fraunces,Georgia,serif; font-size:clamp(18px,2.1vw,23px)!important; line-height:1.42!important; color:var(--cream)!important; cursor:pointer;}
  .object-examine-copy.is-typing::after{content:""; display:inline-block; width:6px; height:1em; margin-left:3px; vertical-align:-.14em; background:var(--gold); animation:objectCaret .7s steps(2,end) infinite;}
  @keyframes objectCaret{50%{opacity:0;}}
  .object-clue-noted{margin-top:15px; padding:10px 12px; border-left:2px solid var(--gold); background:rgba(216,169,78,.08); color:rgba(237,233,222,.94); font-size:13px; line-height:1.45; animation:fadeIn .25s ease both;}
  .object-clue-noted strong{display:block; margin-bottom:3px; color:var(--gold); font-size:9px; letter-spacing:.17em; text-transform:uppercase;}
  .object-step-back{margin-top:20px; border:1px solid rgba(216,169,78,.55); border-radius:999px; padding:10px 15px; background:rgba(216,169,78,.08); color:var(--cream); font:700 10px/1 Inter,system-ui,sans-serif; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;}
  .object-step-back:hover,.object-step-back:focus-visible{background:rgba(216,169,78,.2); outline:1px solid var(--gold); outline-offset:2px;}
  .journal-panel{width:min(650px,92vw);}
  .journal-section{margin-top:20px;}
  .journal-section h3{margin:0 0 8px; color:var(--gold); font:700 10px/1.2 Inter,system-ui,sans-serif; letter-spacing:.17em; text-transform:uppercase;}
  .journal-row{padding:11px 0; border-top:1px solid rgba(237,233,222,.11);}
  .journal-row.is-unfound{color:rgba(237,233,222,.38); font-size:13px; font-style:italic;}
  .journal-source{display:block; margin-bottom:4px; color:rgba(216,169,78,.78); font:700 9px/1.2 Inter,system-ui,sans-serif; letter-spacing:.13em; text-transform:uppercase;}
  .journal-location{display:block; margin-top:5px; color:rgba(237,233,222,.48); font-size:11px;}
  .journal-topic{width:100%; padding:10px 12px; border:1px solid rgba(216,169,78,.35); border-radius:8px; background:rgba(216,169,78,.06); color:var(--cream); text-align:left; cursor:pointer; font:600 12px/1.35 Inter,system-ui,sans-serif;}
  .journal-topic:hover,.journal-topic:focus-visible{background:rgba(216,169,78,.16); border-color:var(--gold); outline:1px solid var(--gold); outline-offset:2px;}
  #topic-toasts{position:absolute; right:3%; bottom:10%; z-index:18; display:flex; flex-direction:column; align-items:flex-end; gap:10px; pointer-events:none; max-width:min(390px,42vw);}
  .topic-toast{pointer-events:auto; width:100%; border:1px solid rgba(216,169,78,.7); border-radius:10px; padding:12px 14px; background:rgba(18,13,17,.96); box-shadow:0 12px 32px rgba(0,0,0,.38); color:var(--cream); text-align:left; cursor:pointer; animation:toastIn .28s cubic-bezier(.2,.8,.2,1) both;}
  .topic-toast:hover,.topic-toast:focus-visible{background:rgba(63,40,21,.98); outline:1px solid var(--gold); outline-offset:2px;}
  .topic-toast-kicker{display:block; margin-bottom:4px; color:var(--gold); font:700 9px/1 Inter,system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase;}
  .topic-toast-name{display:block; font:600 13px/1.3 Inter,system-ui,sans-serif;}
  @keyframes toastIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @media(max-width:520px){ .panel{padding:26px 20px 22px;} .panel h2{font-size:22px;} .evidence-examine{gap:14px; grid-template-columns:minmax(112px,38%) minmax(0,1fr);} .evidence-model{height:142px;} .evidence-copy p{font-size:13.5px;} .object-examine-copy{font-size:19px!important;} .object-examine-panel{max-height:88dvh;} .journal-panel{max-height:88dvh;} }

  /* ---------------- Conversation overlay ---------------- */
  #conversation-root{position:absolute; inset:0; z-index:7; pointer-events:none;}
  #hotspots-layer,#ui-layer{transition:opacity .2s ease;}
  .conversation-shell{position:absolute; inset:0; pointer-events:auto;}
  .conversation-content{position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .15s ease;}
  #conversation-root.is-ready .conversation-content{opacity:1; pointer-events:auto;}
  body.conversation-open #bg{filter:blur(10px) brightness(.35); transform:scale(1.035); transition:filter .35s ease, transform .35s ease;}
  body.conversation-open #hotspots-layer,
  body.conversation-open #ui-layer{opacity:0; pointer-events:none; transition:opacity .2s ease;}
  body.conversation-open #sprites-layer{z-index:8; pointer-events:none;}
  body.conversation-open .sprite:not(.conversation-active){opacity:0; pointer-events:none;}
  .sprite.conversation-active{
    --convo-dx:0px; --convo-dy:0px; --convo-scale:1;
    z-index:2; animation:none !important; pointer-events:none;
    transform:translateX(calc(-50% + var(--convo-dx))) translateY(var(--convo-dy)) scale(var(--convo-scale));
    transform-origin:center bottom; transition:transform .4s cubic-bezier(.2,.8,.2,1); will-change:transform;
  }
  .sprite.conversation-active img{filter:drop-shadow(0 14px 26px rgba(0,0,0,.6)) brightness(1.05);}
  .conversation-nameplate{position:absolute; top:11%; right:5%; width:min(47%,520px); color:var(--cream);}
  .conversation-nameplate .name{font-family:Fraunces,Georgia,serif; font-size:clamp(28px,4.6vw,52px); font-weight:700; letter-spacing:.035em; line-height:1;}
  .conversation-nameplate.is-speaking .name,.conversation-nameplate.is-considering .name{animation:voiceGlow 1.15s ease-in-out infinite alternate;}
  .conversation-nameplate .rule{width:74px; height:1px; margin-top:13px; background:rgba(216,169,78,.82);}
  @keyframes voiceGlow{from{text-shadow:0 0 0 rgba(216,169,78,0);}to{text-shadow:0 0 18px rgba(216,169,78,.75);}}
  .conversation-panel{position:absolute; left:0; right:0; bottom:0; min-height:36%; max-height:48%; overflow-y:auto;
    padding:clamp(20px,3vw,36px) 5% clamp(20px,2.8vw,32px); background:rgba(11,10,16,.88);
    border-top:1px solid rgba(216,169,78,.25); backdrop-filter:blur(12px); box-shadow:0 -16px 42px rgba(0,0,0,.16);}
  .conversation-copy{margin-left:41%; max-width:min(660px,55vw);}
  .question-budget{position:absolute; top:18px; right:5%; display:flex; align-items:center; gap:8px; color:rgba(237,233,222,.68); font-size:10px; letter-spacing:.1em; text-transform:uppercase; font-weight:600;}
  .budget-dots{display:flex; gap:5px;}
  .budget-dot{width:7px; height:7px; border-radius:50%; border:1px solid rgba(216,169,78,.55); background:transparent;}
  .budget-dot.filled{background:var(--gold); box-shadow:0 0 9px rgba(216,169,78,.42);}

  /* =====================================================================
     EDITOR — everything below is scoped to body.edit-mode so normal mode is
     byte-for-byte unaffected. The stage and renderer are shared, not cloned.
  ===================================================================== */
  #editor-panel{display:none;}
  body.edit-mode #app{justify-content:flex-start;}
  body.edit-mode #editor-panel{
    display:flex; flex-direction:column; width:280px; min-width:280px; height:100vh;
    background:var(--panel); border-right:1px solid var(--line); overflow-y:auto;
    font-size:12px;
  }
  body.edit-mode #stage-wrap{
    flex:1; height:100vh; display:flex; align-items:center; justify-content:center; min-width:0;
  }
  body.edit-mode #stage{
    width:min(100%, calc(100vh * 16 / 9));
    height:min(100vh, calc((100vw - 280px) * 9 / 16));
  }
  body.edit-mode #editor-overlay{display:block;}
  #stage-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}

  .ed-sec{border-bottom:1px solid var(--line); padding:12px 14px;}
  .ed-sec h3{margin:0 0 9px; font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:#8B8FA0; font-weight:700;}
  .ed-row{display:flex; gap:6px;}
  .ed-btn{
    flex:1; background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--cream);
    padding:8px 10px; border-radius:7px; cursor:pointer; font-size:11px; font-weight:600;
    letter-spacing:.08em; text-transform:uppercase; font-family:inherit; transition:.15s;
  }
  .ed-btn:hover{background:rgba(216,169,78,.14); border-color:rgba(216,169,78,.5);}
  .ed-btn.active{background:var(--gold); color:#1a1508; border-color:var(--gold);}
  .ed-btn.danger:hover{background:rgba(200,60,50,.22); border-color:rgba(200,60,50,.6);}
  .ed-btn.sm{padding:6px 8px; font-size:10px;}

  .ed-item{
    display:flex; align-items:center; gap:9px; padding:6px; border-radius:7px; cursor:pointer;
    border:1px solid transparent; margin-bottom:4px;
  }
  .ed-item:hover{background:rgba(255,255,255,.05);}
  .ed-item.active{background:rgba(216,169,78,.14); border-color:rgba(216,169,78,.45);}
  .ed-item .meta{min-width:0; flex:1;}
  .ed-item .nm{font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ed-item .sub{font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:#8B8FA0; margin-top:2px;}
  .ed-item .sub.here{color:var(--gold);}
  .ed-item .sub.dim{color:#5A5E6B;}

  .ed-thumb{width:52px; height:29px; border-radius:4px; background-size:cover; background-position:center; flex-shrink:0; border:1px solid var(--line);}
  .ed-sprite-thumb{
    width:32px; height:44px; flex-shrink:0; border-radius:4px; border:1px solid var(--line);
    background-image:
      linear-gradient(45deg,#2a2a32 25%,transparent 25%,transparent 75%,#2a2a32 75%),
      linear-gradient(45deg,#2a2a32 25%,transparent 25%,transparent 75%,#2a2a32 75%);
    background-size:10px 10px; background-position:0 0,5px 5px; background-color:#1b1b22;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .ed-sprite-thumb img{max-width:100%; max-height:100%; object-fit:contain; display:block;}

  .ed-field{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
  .ed-field label{width:58px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#8B8FA0; flex-shrink:0;}
  .ed-field input{
    flex:1; min-width:0; background:#0E0D14; border:1px solid var(--line); color:var(--cream);
    padding:6px 8px; border-radius:5px; font-size:12px; font-family:inherit;
    font-variant-numeric:tabular-nums;
  }
  .ed-field input:focus{outline:none; border-color:var(--gold);}
  .ed-field input:disabled{color:#6B6F7C; background:#0A0910;}
  .ed-field input.text{font-variant-numeric:normal;}

  .ed-hint{font-size:10px; color:#6B6F7C; line-height:1.55;}
  .ed-slider{width:100%; accent-color:var(--gold);}
  /* Keep the unsaved marker scoped to the editor panel. A previous body-level state
     class could collide with this tiny indicator and collapse the whole page after
     selecting or dragging an item. */
  .ed-dirty-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--gold);
    margin-left:6px; vertical-align:middle; visibility:hidden;
  }
  #editor-panel.is-dirty .ed-dirty-dot{visibility:visible;}
  .ed-stats{font-size:9.5px; color:#6B6F7C; font-variant-numeric:tabular-nums; line-height:1.6;}

  /* ---- selection chrome (inside stage, above everything) ---- */
  .sel-box{position:absolute; border:1px solid var(--gold); pointer-events:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 14px rgba(216,169,78,.3);}
  .sel-handle{
    position:absolute; width:10px; height:10px; background:var(--gold); border:1px solid #1a1508;
    border-radius:2px; pointer-events:auto; z-index:2;
  }
  .sel-handle.nw{cursor:nwse-resize;} .sel-handle.ne{cursor:nesw-resize;}
  .sel-handle.sw{cursor:nesw-resize;} .sel-handle.se{cursor:nwse-resize;}

<script>
(function(){
/* =====================================================================
   POCKET PORTAL — shell + scene editor.
   The renderer below is the ONLY renderer. Edit mode layers selection
   chrome on top of it and mutates WORK; it never re-implements drawing,
   so the editor is pixel-identical to play mode by construction.
===================================================================== */
const EDIT_MODE = new URLSearchParams(location.search).get('edit') === '1';
const PORTAL_WINDOW = {
  enabled:true,
  demoMode:true,
  closesInSeconds:13612,
  nextEpisodeLabel:'Episode 3 drops when the portal closes'
};
/* Databricks is optional infrastructure: the listener path never awaits it. */
const DBX = {enabled:true, proxy:"http://localhost:8787/sql", warehouseId:"7a91f4e516747541", table:"workspace.default.portal_events"};
const DBX_SESSION_ID = (crypto.randomUUID ? crypto.randomUUID() : 'portal-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const dbxQueue = [];
let dbxConnected = false, dbxFlushTimer = null;
const LS_KEY = 'pocketportal.editor.draft.v1';
const DEFAULT_EXIT_POS = {x:"88%", y:"40%", w:"10%", h:"34%"};
const DEFAULT_CHAR_POS = {x:"50%", y:"35%", h:"50%"};

/* ---------------- working state — the renderer's single source of truth --------------- */
function buildWork(){
  return {
    characters: Object.fromEntries(Object.entries(PORTAL_WORLD.characters).map(([id,c]) => [id, {
      room: c.room || null,
      position: {...(c.position || DEFAULT_CHAR_POS)},
      z: (typeof c.z === 'number') ? c.z : 0
    }])),
    objects: PORTAL_WORLD.objects.map(o => ({
      id:o.id, room:o.room, label:o.label, text:o.text || "", clue:o.clue || "", vd:o.vd || "",
      hotspot:{...o.hotspot}, isNew:false
    }))
  };
}
let WORK = buildWork();

const state = {
  roomId: (PORTAL_WORLD.rooms.find(r=>r.entry) || PORTAL_WORLD.rooms[0]).id,
  seen: new Set()
};

/* Task 4 conversation state stays in memory only. Tasks 5–8 can build on these
   narrow extension points without changing the room renderer or editor. */
const foundClues = new Set();
const PORTAL_EVENTS = [];
const askedTopicsByCharacter = new Map();
const conversationProgressByCharacter = new Map();
const clueHistory = [];
const announcedTopics = new Set();
const FREE_TEXT_ENABLED = true;
let conversation = null;

window.PORTAL_EVENTS = PORTAL_EVENTS;
window.PORTAL_FOUND_CLUES = foundClues;
window.addPortalClue = clueId => {
  if(typeof clueId !== 'string' || !clueId.trim()) return false;
  return collectClue(clueId.trim());
};
window.removePortalClue = clueId => {
  const removed = foundClues.delete(clueId);
  if(conversation) renderConversationControls();
  updateClueCounter();
  return removed;
};

const el = {
  stage: document.getElementById('stage'),
  bg: document.getElementById('bg'),
  sprites: document.getElementById('sprites-layer'),
  hotspots: document.getElementById('hotspots-layer'),
  exitButtons: document.getElementById('exit-buttons'),
  fade: document.getElementById('fade-overlay'),
  title: document.getElementById('ui-title'),
  subtitle: document.getElementById('ui-subtitle'),
  countdown: document.getElementById('ui-countdown'),
  windowLabel: document.getElementById('ui-window-label'),
  presence: document.getElementById('ui-presence'),
  roomName: document.getElementById('ui-room-name'),
  clueCount: document.getElementById('ui-clue-count'),
  modalRoot: document.getElementById('modal-root'),
  conversationRoot: document.getElementById('conversation-root'),
  entryCard: document.getElementById('entry-card'),
  entryReplay: document.getElementById('entry-replay'),
  voiceWarmStatus: document.getElementById('voice-warm-status'),
  voiceMute: document.getElementById('voice-mute'),
  topicToasts: document.getElementById('topic-toasts'),
  leavePortal: document.getElementById('leave-portal'),
  ritualRoot: document.getElementById('ritual-root'),
  writerStudio: document.getElementById('writer-studio'),
  writerStudioToggle: document.getElementById('writer-studio-toggle'),
  panel: document.getElementById('editor-panel'),
  selChrome: document.getElementById('sel-chrome'),
  baseline: document.getElementById('baseline')
};

const hasHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
const usesTouchSelection = !hasHover || window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
const usesTalkButton = () => usesTouchSelection && window.innerWidth < 700;
document.body.classList.add(usesTouchSelection ? 'no-hover' : 'has-hover');

function showEntryCard(){
  if(EDIT_MODE) return;
  warmPortalVoices();
  el.entryCard.classList.remove('is-leaving');
  el.entryCard.innerHTML = '<div class="entry-card-copy">'+
    '<p class="entry-card-line entry-card-kicker">THE EVENING AFTER</p>'+
    '<p class="entry-card-line entry-card-main first">The episodes are what Bua chose to tell you.</p>'+
    '<p class="entry-card-line entry-card-main second">This is the evening she didn\'t.</p>'+
    '<p class="entry-card-line entry-card-instruction">You are Bua. Walk the house. Ask what you like.</p>'+
    '</div><button class="entry-card-skip" type="button" aria-label="Enter the portal" title="Enter the portal">›</button>';
  requestAnimationFrame(() => el.entryCard.classList.add('is-visible'));
}
function hideEntryCard(){
  el.entryCard.classList.remove('is-visible');
  el.entryCard.classList.add('is-leaving');
}
el.entryCard.addEventListener('click', e => { if(e.target.closest('.entry-card-skip')) hideEntryCard(); });
el.entryReplay.addEventListener('click', showEntryCard);

/* sprite natural aspect (w/h), needed for aspect-locked scaling + width readout */
const ASPECT = {};
function preloadAll(){
  const seen = new Set();
  PORTAL_WORLD.rooms.forEach(r => { if(!seen.has(r.image)){ seen.add(r.image); new Image().src = r.image; } });
  Object.entries(PORTAL_WORLD.characters).forEach(([id,c]) => {
    const img = new Image();
    img.onload = () => { ASPECT[id] = img.naturalWidth / img.naturalHeight; if(EDIT_MODE) renderOverlay(); };
    img.src = c.sprite;
  });
}

const num = v => parseFloat(v) || 0;
const pct = n => n.toFixed(1) + '%';
const getRoom = id => PORTAL_WORLD.rooms.find(r => r.id === id);
const charsInRoom = roomId => Object.entries(WORK.characters)
  .filter(([,c]) => c.room === roomId)
  .sort((a,b) => (a[1].z||0) - (b[1].z||0));
const objsInRoom = roomId => WORK.objects.filter(o => o.room === roomId);

/* ---------------- shared renderer ---------------- */
function buildSprite(charId){
  const def = PORTAL_WORLD.characters[charId];
  const w = WORK.characters[charId];
  const wrap = document.createElement('div');
  wrap.className = 'sprite';
  wrap.dataset.charId = charId;
  wrap.style.left = w.position.x;
  wrap.style.top = w.position.y;
  wrap.style.height = w.position.h;
  wrap.tabIndex = 0;
  wrap.setAttribute('role','button');
  wrap.setAttribute('aria-label', def.label);

  const img = document.createElement('img');
  img.src = def.sprite; img.alt = def.label; img.draggable = false;

  const pill = document.createElement('div');
  pill.className = 'label-pill'; pill.textContent = def.label;

  const ring = document.createElement('div'); ring.className = 'pulse-ring';
  const talk = document.createElement('button');
  talk.type = 'button'; talk.className = 'talk-prompt'; talk.textContent = 'Talk';
  talk.setAttribute('aria-label', 'Talk to '+def.label);
  wrap.append(img, pill, ring, talk);

  if(EDIT_MODE){
    wrap.addEventListener('pointerdown', e => beginSpriteDrag(e, charId));
  } else {
    talk.addEventListener('click', e => { e.stopPropagation(); openCharacter(charId); });
    wrap.addEventListener('click', () => {
      if(usesTalkButton()){
        el.sprites.querySelectorAll('.sprite.talk-ready').forEach(node => node.classList.remove('talk-ready'));
        wrap.classList.add('talk-ready');
        return;
      }
      openCharacter(charId);
    });
    wrap.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openCharacter(charId); } });
  }
  return wrap;
}

function buildObjectHotspot(o){
  const r = o.hotspot;
  const wrap = document.createElement('div');
  wrap.className = 'hotspot object-hotspot' + (num(r.x) + num(r.w)/2 > 55 ? ' flip' : '');
  wrap.dataset.objId = o.id;
  wrap.style.left = r.x; wrap.style.top = r.y; wrap.style.width = r.w; wrap.style.height = r.h;
  wrap.tabIndex = 0;
  wrap.setAttribute('role','button');
  wrap.setAttribute('aria-label', o.label);

  const dot = document.createElement('div'); dot.className = 'dot';
  const pill = document.createElement('div'); pill.className = 'label-pill'; pill.textContent = o.label;
  wrap.append(dot, pill);

  if(EDIT_MODE){

}

const VOICE_WARM_CONCURRENCY = 4;

let portalVoiceQueue = [], portalVoiceActive = 0, portalVoiceSequence = 0;
let portalVoiceTotal = 0, portalVoiceFinished = 0, portalVoicesWarmed = false;
let portalVoiceWarmStartedAt = 0, portalVoiceWarmReported = false;
let portalVoiceMuted = false, activePortalAudio = null, portalPlaybackToken = 0;
const portalVoiceKey = (charId, responseId) => charId+'::'+responseId;

function authoredResponse(charId, responseId){
  const c = PORTAL_WORLD.characters[charId];
  if(!c) return null;
  if(responseId === 'opening') return responseEntry(c.openingLine);
  if(responseId === 'reentry') return responseEntry(c.reentryLine);
  if(responseId === 'budget') return responseEntry(c.budgetExhausted);

function updateVoiceWarmStatus(){
  if(!el.voiceWarmStatus) return;

  el.voiceWarmStatus.textContent = hasWork ? 'Voices '+portalVoiceFinished+'/'+portalVoiceTotal : '';
  el.voiceWarmStatus.classList.toggle('is-warming', hasWork);

function queuePortalVoice(charId, responseId, response, tier=6){
  const key = portalVoiceKey(charId, responseId);
  if(portalVoiceCache.has(key)) return portalVoiceCache.get(key);
  const noVoice = !window.OPENAI_API_KEY || !VOICE_CAST[charId] || !response || !response.t;
  const record = {key, charId, responseId, response, status:noVoice?'silent':'queued', url:null, resolve:null, promise:null};
  record.promise = new Promise(resolve => { record.resolve = resolve; });
  portalVoiceCache.set(key, record);
  if(noVoice){ record.resolve(null); return record; }
  portalVoiceTotal += 1;
  record.tier = tier;
  record.sequence = portalVoiceSequence++;
  portalVoiceQueue.push(record);
  portalVoiceQueue.sort((a,b) => a.tier-b.tier || a.sequence-b.sequence);
  updateVoiceWarmStatus();
  pumpPortalVoiceQueue();
  return record;
}
async function createPortalVoiceClip(job){
  const cast = VOICE_CAST[job.charId];

    const response = await fetch('https://api.openai.com/v1/audio/speech', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+window.OPENAI_API_KEY},
      body:JSON.stringify({model:'gpt-4o-mini-tts', voice:cast.voice, input:job.response.t,
        instructions:cast.persona+' '+(job.response.vd || ''), response_format:'mp3'})
    });
    if(!response.ok) return null;
    return URL.createObjectURL(await response.blob());
  }catch(error){ return null; }
}
function pumpPortalVoiceQueue(){
  while(portalVoiceActive < VOICE_WARM_CONCURRENCY && portalVoiceQueue.length){
    const job = portalVoiceQueue.shift();
    portalVoiceActive += 1;
    job.status = 'generating';
    createPortalVoiceClip(job).then(url => {
      job.url = url; job.status = url ? 'ready' : 'failed'; job.resolve(url);
    }).finally(() => {
      portalVoiceActive -= 1; portalVoiceFinished += 1;
      if(!portalVoiceWarmReported && portalVoiceFinished === portalVoiceTotal && portalVoiceQueue.length === 0 && portalVoiceActive === 0){
        portalVoiceWarmReported = true;
        logPortalEvent('voice_warm_complete', {clips:portalVoiceTotal, ms:Math.round(performance.now()-portalVoiceWarmStartedAt)});
      }

  }

  const entryRoom = PORTAL_WORLD.rooms.find(room => room.entry);

    .filter(topic => topic.always).forEach(topic => jobs.push([2,charId,'topic:'+topic.id])));
  PORTAL_WORLD.rooms.filter(room => !room.entry).forEach(room => room.characters.forEach(charId => PORTAL_WORLD.characters[charId].topics
    .filter(topic => topic.always).forEach(topic => jobs.push([3,charId,'topic:'+topic.id]))));
  Object.keys(PORTAL_WORLD.characters).forEach(charId => ['budget','reentry','unknown'].forEach(id => jobs.push([4,charId,id])));

  };
  typeDialogue(response.t, () => { textFinished = true; complete(); });
  if(portalVoiceMuted || !clip || clip.status === 'silent' || clip.status === 'failed') return;
  const line = el.conversationRoot.querySelector('.dialogue-line');
  if(clip.url){ audioFinished = false; startPortalVoice(clip.url, token, () => { audioFinished = true; complete(); }); return; }
  if(line) line.classList.add('audio-pending');
  clip.promise.then(url => {
    if(token !== portalPlaybackToken) return;
    el.conversationRoot.querySelector('.dialogue-line')?.classList.remove('audio-pending');
    if(!url) return;
    audioFinished = false;
    startPortalVoice(url, token, () => { audioFinished = true; complete(); });
  });
}

function renderConversationControls(){
  if(!conversation) return;
  const controls = el.conversationRoot.querySelector('.conversation-controls');
  if(!controls) return;
  const c = PORTAL_WORLD.characters[conversation.charId];

  if(conversation.exhausted){
    controls.innerHTML = '<div class="topic-area" aria-live="polite">No more questions tonight.</div>';
    renderQuestionBudget();
    return;
  }

  const busy = conversation.thinking ? ' disabled' : '';
  const chips = c.topics.map(topic => {
    const available = isTopicAvailable(topic);
    const asked = conversation.askedTopics.has(topic.id);
    const focused = conversation.focusTopicId === topic.id;
    const classes = 'topic-chip'+(asked?' asked':'')+(available?'':' locked')+(focused?' focused':'');
    const lock = available ? '' : '<span class="lock-glyph" aria-hidden="true"></span>';
    const marker = asked ? '<span class="asked-marker">Asked</span>' : '';
    const hint = available ? '' : '<span class="topic-hint">Find something first.</span>';
    const disabled = available ? busy : ' disabled title="Find something first."';
    return '<button type="button" class="'+classes+'" data-topic-id="'+esc(topic.id)+'"'+(focused?' aria-current="true"':'')+disabled+'>'+lock+esc(topic.label)+marker+hint+'</button>';
  }).join('');

  const freeDisabled = FREE_TEXT_ENABLED ? busy : ' disabled title="Coming next"';
  controls.innerHTML = '<div class="topic-area"><div class="topic-menu">'+chips+'</div>'+
    '<div class="free-question"><input type="text" aria-label="Ask something else" placeholder="Ask something else..."'+freeDisabled+'>'+ 
    '<button type="button"'+freeDisabled+'>Send</button></div></div>';

  controls.querySelectorAll('[data-topic-id]').forEach(btn => {
    btn.addEventListener('click', () => askCharacterQuestion(btn.dataset.topicId, null));
  });
  const freeInput = controls.querySelector('.free-question input');
  const freeButton = controls.querySelector('.free-question button');
  if(freeInput) freeInput.placeholder = 'Ask her something…';
  const sendFreeText = () => askCharacterQuestion(null, freeInput.value.trim());
  freeButton.addEventListener('click', sendFreeText);
  freeInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); sendFreeText(); } });
  renderQuestionBudget();
}

function finishDialogueTyping(){
  if(!conversation || !conversation.typing) return false;
  clearTimeout(conversation.typeTimer);
  conversation.typing = false;
  const line = el.conversationRoot.querySelector('.dialogue-line');
  if(line){ line.classList.remove('thinking'); line.textContent = conversation.fullLine; }
  const done = conversation.typeDone;
  conversation.typeDone = null;
  if(done) done();
  return true;
}

function typeDialogue(text, onComplete){
  if(!conversation) return;
  const line = el.conversationRoot.querySelector('.dialogue-line');
  if(!line) return;
  clearTimeout(conversation.typeTimer);
  conversation.fullLine = text || '';
  conversation.typeDone = onComplete || null;
  conversation.typeInterval = 22;
  line.classList.remove('thinking');
  line.textContent = '';

  if(!conversation.fullLine){
    conversation.typing = false;
    line.textContent = conversation.fullLine;
    const done = conversation.typeDone;
    conversation.typeDone = null;
    if(done) done();
    return;
  }

  conversation.typing = true;
  let index = 0;
  const tick = () => {
    if(!conversation || conversation.closing) return;
    index += 1;
    line.textContent = conversation.fullLine.slice(0, index);
    if(index < conversation.fullLine.length){ conversation.typeTimer = setTimeout(tick, conversation.typeInterval || 22); }
    else { conversation.typing = false; const done = conversation.typeDone; conversation.typeDone = null; if(done) done(); }
  };
  tick();
}

function showBudgetExhausted(){
  if(!conversation || conversation.closing) return;
  const activeConversation = conversation;
  setTimeout(() => {
    if(conversation !== activeConversation || conversation.closing) return;
    const shell = el.conversationRoot.querySelector('.conversation-shell');
    if(shell) shell.classList.add('is-exhausting');
    setTimeout(() => {
      if(conversation !== activeConversation || conversation.closing) return;
      conversation.exhausted = true;
      conversation.progress.exhausted = true;
      renderConversationControls();
      revealResponseWithVoice(conversation.charId, 'budget', responseEntry(PORTAL_WORLD.characters[conversation.charId].budgetExhausted));
    }, prefersReducedMotion() ? 0 : 220);
  }, 1000);
}

async function askCharacterQuestion(topicId, freeText){
  if(!conversation || conversation.closing || conversation.exhausted || conversation.thinking) return;
  const c = PORTAL_WORLD.characters[conversation.charId];
  const topic = topicId ? c.topics.find(item => item.id === topicId) : null;
  if(topic && !isTopicAvailable(topic)) return;
  if(!topic && !freeText) return;
  if(conversation.questionsRemaining <= 0) return;

  const activeConversation = conversation;
  stopPortalVoice();
  if(conversation.typing) finishDialogueTyping();
  conversation.questionsRemaining -= 1;
  conversation.questionsAsked += 1;
  conversation.progress.questionsRemaining = conversation.questionsRemaining;
  conversation.progress.questionsAsked = conversation.questionsAsked;
  if(topic) conversation.askedTopics.add(topic.id);
  logPortalEvent('question', {character:conversation.charId, topic:topic ? topic.id : 'free_text', freeText:freeText || null});
  let response;
  if(topic){
    response = fallbackFor(c, topic.id);
  }else{
    conversation.thinking = true;
    renderConversationControls();
    const line = el.conversationRoot.querySelector('.dialogue-line');
    if(line){ line.classList.add('thinking'); line.textContent = ''; }
    el.conversationRoot.querySelector('.conversation-nameplate')?.classList.add('is-considering');
    response = await getCharacterResponse(conversation.charId, freeText, conversation);
  }
  if(!topic) logPortalEvent('free_question',{character:activeConversation.charId,question:String(freeText).trim(),topicTag:response.topicTag,answerType:response.answerType});
  if(conversation !== activeConversation || conversation.closing) return;

  conversation.thinking = false;
  el.conversationRoot.querySelector('.conversation-nameplate')?.classList.remove('is-considering');
  conversation.progress.lastAnswer = response.t;
  if(topic && topic.grantsClue) collectClue(topic.grantsClue, {
    source:'conversation', sourceId:conversation.charId+':'+topic.id, room:c.room
  });
  renderConversationControls();
  const responseId = topic ? 'topic:'+topic.id : 'free:'+normaliseFreeQuestion(freeText);
  revealResponseWithVoice(conversation.charId, responseId, response, conversation.questionsRemaining === 0 ? showBudgetExhausted : null);
}

function sourceSpriteRect(charId){
  const stage = stageRect();
  const box = charPxBox(charId);
  return {left:stage.left+box.left, top:stage.top+box.top, width:box.width, height:box.height, bottom:stage.top+box.top+box.height};
}
function isCompactViewport(){ return !EDIT_MODE && window.innerWidth < 700; }
function positionConversationSprite(useCurrentRect){
  if(!conversation) return;
  const stage = stageRect();
  const compact = isCompactViewport();
  const surface = compact ? {left:0, top:0, width:window.innerWidth, height:window.innerHeight} : stage;
  const source = useCurrentRect || compact ? conversation.originRect : sourceSpriteRect(conversation.charId);
  if(!source || !source.height) return;
  const targetHeight = surface.height * (compact ? .39 : .88);
  const targetCenterX = surface.left + surface.width * (compact ? .5 : .28);
  const targetBottom = compact ? surface.top + surface.height * .38 : surface.top + surface.height;
  conversation.sprite.style.setProperty('--convo-dx', (targetCenterX - (source.left + source.width/2))+'px');
  conversation.sprite.style.setProperty('--convo-dy', (targetBottom - source.bottom)+'px');
  conversation.sprite.style.setProperty('--convo-scale', String(targetHeight/source.height));

function openCharacter(charId, focusTopicId=null){
  if(EDIT_MODE || conversation) return;
  const c = PORTAL_WORLD.characters[charId];
  const sprite = el.sprites.querySelector('[data-char-id="'+CSS.escape(charId)+'"]');
  if(!c || !sprite) return;

  const progress = conversationProgressFor(charId);
  const isReentry = progress.hasOpened;
  progress.hasOpened = true;
  const mobilePresentation = isCompactViewport();
  const originRect = sprite.getBoundingClientRect();
  conversation = {
    charId, sprite, originRect, progress, mobilePresentation,
    spriteStyle:{left:sprite.style.left, top:sprite.style.top, height:sprite.style.height, position:sprite.style.position},
    questionsRemaining:progress.questionsRemaining, questionsAsked:progress.questionsAsked,
    askedTopics:askedTopicsFor(charId), typing:false, typeTimer:null, typeDone:null,
    thinking:false, exhausted:progress.exhausted, closing:false, fullLine:'', focusTopicId
  };
  logPortalEvent('conversation_open', {character:charId});
  el.conversationRoot.className = '';
  el.conversationRoot.innerHTML = conversationMarkup(charId);
  renderConversationControls();
  const panel = el.conversationRoot.querySelector('.conversation-panel');
  panel.addEventListener('click', e => {
    if(e.target.closest('button, input, textarea, label')) return;
    if(!conversation || !conversation.closing) finishDialogueTyping();
  });
  el.conversationRoot.querySelector('[data-end-conversation]').addEventListener('click', closeConversation);
  el.conversationRoot.querySelector('[data-voice-mute]').addEventListener('click', () => setPortalVoiceMuted(!portalVoiceMuted));
  el.conversationRoot.querySelector('[data-knowledge-toggle]').addEventListener('click', e => {
    const panel=el.conversationRoot.querySelector('[data-knowledge-panel]');
    if(!panel) return;
    const open=!panel.classList.contains('is-open');
    panel.classList.toggle('is-open',open); e.currentTarget.setAttribute('aria-expanded',String(open));
  });
  syncVoiceMuteControls();

  document.body.classList.add('conversation-open');
  sprite.classList.remove('talk-ready');
  if(mobilePresentation){
    sprite.style.position = 'fixed';
    sprite.style.left = (originRect.left + originRect.width/2)+'px';
    sprite.style.top = originRect.top+'px';
    sprite.style.height = originRect.height+'px';
  }
  sprite.classList.add('conversation-active');
  const reveal = () => {
    if(!conversation || conversation.charId !== charId || conversation.closing) return;
    el.conversationRoot.classList.add('is-ready');
    panel.focus({preventScroll:true});
    const responseId = progress.exhausted ? 'budget' : (isReentry ? 'reentry' : 'opening');
    revealResponseWithVoice(charId, responseId, authoredResponse(charId, responseId));
  };
  if(prefersReducedMotion()){
    positionConversationSprite(true);
    reveal();
  } else {
    requestAnimationFrame(() => positionConversationSprite(true));
    setTimeout(reveal, 420);
  }
}

function closeConversation(){
  if(!conversation || conversation.closing) return;
  const activeConversation = conversation;
  activeConversation.closing = true;
  stopPortalVoice();
  clearTimeout(activeConversation.typeTimer);
  activeConversation.progress.questionsRemaining = activeConversation.questionsRemaining;
  activeConversation.progress.questionsAsked = activeConversation.questionsAsked;
  logPortalEvent('conversation_close', {character:activeConversation.charId, questionsAsked:activeConversation.questionsAsked});
  el.conversationRoot.classList.remove('is-ready');
  activeConversation.sprite.style.setProperty('--convo-dx', '0px');
  activeConversation.sprite.style.setProperty('--convo-dy', '0px');
  activeConversation.sprite.style.setProperty('--convo-scale', '1');
  const cleanUp = () => {
    if(conversation !== activeConversation) return;
    activeConversation.sprite.classList.remove('conversation-active');
    activeConversation.sprite.style.removeProperty('--convo-dx');
    activeConversation.sprite.style.removeProperty('--convo-dy');
    activeConversation.sprite.style.removeProperty('--convo-scale');
    if(activeConversation.mobilePresentation){
      activeConversation.sprite.style.left = activeConversation.spriteStyle.left;
      activeConversation.sprite.style.top = activeConversation.spriteStyle.top;
      activeConversation.sprite.style.height = activeConversation.spriteStyle.height;
      activeConversation.sprite.style.position = activeConversation.spriteStyle.position;
    }
    document.body.classList.remove('conversation-open');
    el.conversationRoot.innerHTML = '';
    el.conversationRoot.className = '';
    conversation = null;
    maybeAutoExitRitual();
  };
  if(prefersReducedMotion()) cleanUp(); else setTimeout(cleanUp, 410);
}

    opacity:cfg.opacity == null ? 1 : cfg.opacity, depthWrite:cfg.depthWrite !== false, side:cfg.side || T.FrontSide});
  const outlineMaterial = new T.MeshBasicMaterial({color:0x08070a, side:T.BackSide, transparent:!!cfg.transparent,

}

window.addEventListener('pointermove', e => {
  const d = ed.drag; if(!d) return;

  if(d.kind === 'move-char'){
    const p = WORK.characters[d.id].position;
    p.x = pct(clamp(d.origX + (e.clientX-d.startX)/d.sw*100, -20, 120));
    p.y = pct(clamp(d.origY + (e.clientY-d.startY)/d.sh*100, -40, 110));
    syncCharEl(d.id);
  }
  else if(d.kind === 'move-obj'){
    const r = WORK.objects.find(o=>o.id===d.id).hotspot;
    r.x = pct(clamp(d.origX + (e.clientX-d.startX)/d.sw*100, -20, 120));
    r.y = pct(clamp(d.origY + (e.clientY-d.startY)/d.sh*100, -20, 120));
    syncObjEl(d.id);
  }
  else if(d.kind === 'scale-char'){
    /* aspect locked, anchored to BOTTOM CENTRE so feet stay planted */
    const p = WORK.characters[d.id].position;
    const aspect = ASPECT[d.id] || 0.35;
    let hPct;
    if(d.dir === 'nw' || d.dir === 'ne'){
      const bottomPx = d.bottomPct/100 * d.sh;
      hPct = (bottomPx - (e.clientY - d.sTop)) / d.sh * 100;
    } else {
      const centerPx = d.centerPct/100 * d.sw;
      const halfW = Math.abs((e.clientX - d.sLeft) - centerPx);
      hPct = (halfW*2 / aspect) / d.sh * 100;
    }
    hPct = clamp(hPct, 3, 200);
    p.h = pct(hPct);
    p.y = pct(d.bottomPct - hPct);   /* keep bottom fixed */
    syncCharEl(d.id);
  }
  else if(d.kind === 'scale-obj'){
    /* free resize, independent w/h */
    const r = WORK.objects.find(o=>o.id===d.id).hotspot;
    const mx = (e.clientX - d.sLeft)/d.sw*100, my = (e.clientY - d.sTop)/d.sh*100;
    let {x,y,w,h} = d;
    const right = d.x + d.w, bottom = d.y + d.h;
    if(d.dir.includes('w')){ x = Math.min(mx, right-1); w = right - x; }
    if(d.dir.includes('e')){ w = Math.max(1, mx - d.x); }
    if(d.dir.includes('n')){ y = Math.min(my, bottom-1); h = bottom - y; }
    if(d.dir.includes('s')){ h = Math.max(1, my - d.y); }
    r.x = pct(x); r.y = pct(y); r.w = pct(w); r.h = pct(h);
    syncObjEl(d.id);
  }
  positionChrome();
  updateInspectorValues();
});

window.addEventListener('pointerup', () => {
  if(!ed.drag) return;
  ed.drag = null;
  document.body.classList.remove('dragging');
  markDirty(true);
  renderPanel();
});

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* live DOM sync without a full re-render (keeps drags smooth) */
function syncCharEl(charId){
  const node = el.sprites.querySelector('[data-char-id="'+charId+'"]');
  if(!node) return;
  const p = WORK.characters[charId].position;
  node.style.left = p.x; node.style.top = p.y; node.style.height = p.h;
}
function syncObjEl(objId){
  const node = el.hotspots.querySelector('[data-obj-id="'+CSS.escape(objId)+'"]');
  if(!node) return;
  const r = WORK.objects.find(o=>o.id===objId).hotspot;
  node.style.left = r.x; node.style.top = r.y; node.style.width = r.w; node.style.height = r.h;
}

/* ---- selection chrome ---- */
function renderOverlay(){
  el.selChrome.innerHTML = '';
  if(!ed.sel) return;
  const isChar = ed.sel.type === 'char';
  if(isChar && ed.mode !== 'characters') return;
  if(!isChar && ed.mode !== 'hotspots') return;

  const box = document.createElement('div');
  box.className = 'sel-box';
  box.id = 'sel-box';

  const dirs = isChar ? ['nw','ne','sw','se'] : ['nw','ne','sw','se','n','s','e','w'];
  const frag = document.createDocumentFragment();
  frag.appendChild(box);
  dirs.forEach(dir => {
    const hnd = document.createElement('div');
    hnd.className = 'sel-handle ' + dir;
    hnd.dataset.dir = dir;
    hnd.addEventListener('pointerdown', e => beginHandleDrag(e, dir));
    frag.appendChild(hnd);
  });

  const bar = document.createElement('div');
  bar.className = 'sel-toolbar'; bar.id = 'sel-toolbar';
  const nm = document.createElement('span');
  nm.className = 'nm';
  nm.textContent = isChar ? PORTAL_WORLD.characters[ed.sel.id].label
                          : (WORK.objects.find(o=>o.id===ed.sel.id).label || ed.sel.id);
  const del = document.createElement('button');
  del.textContent = '\u2715'; del.title = 'Delete';
  del.addEventListener('pointerdown', e => e.stopPropagation());
  del.addEventListener('click', deleteSelection);
  bar.append(nm, del);
  frag.appendChild(bar);

  el.selChrome.appendChild(frag);
  positionChrome();
}

function positionChrome(){
  const box = document.getElementById('sel-box');
  if(!box) return;
  const b = selPxBox(); if(!b) return;
  Object.assign(box.style, { left:b.left+'px', top:b.top+'px', width:b.width+'px', height:b.height+'px' });
  const at = {
    nw:[b.left, b.top], ne:[b.left+b.width, b.top],
    sw:[b.left, b.top+b.height], se:[b.left+b.width, b.top+b.height],
    n:[b.left+b.width/2, b.top], s:[b.left+b.width/2, b.top+b.height],
    w:[b.left, b.top+b.height/2], e:[b.left+b.width, b.top+b.height/2]
  };
  el.selChrome.querySelectorAll('.sel-handle').forEach(h => {
    const [x,y] = at[h.dataset.dir];
    h.style.left = (x-5)+'px'; h.style.top = (y-5)+'px';
  });
  const bar = document.getElementById('sel-toolbar');
  if(bar){ bar.style.left = b.left+'px'; bar.style.top = b.top+'px'; }
  updateStats(b);
}

function updateStats(b){
  const node = document.getElementById('ed-stats');
  if(!node) return;
  const s = stageRect();
  let txt = 'stage '+Math.round(s.width)+'\u00D7'+Math.round(s.height)+'px';
  if(b) txt += ' \u00B7 sel '+Math.round(b.width)+'\u00D7'+Math.round(b.height)+'px';
  node.textContent = txt;
}

function deleteSelection(){
  if(!ed.sel) return;
  if(ed.sel.type === 'char'){
    WORK.characters[ed.sel.id].room = null;
  } else {
    const i = WORK.objects.findIndex(o => o.id === ed.sel.id);
    if(i >= 0) WORK.objects.splice(i,1);
  }
  ed.sel = null;
  markDirty(true);
  renderRoom();
}

/* ---- keyboard ---- */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(conversation){ e.preventDefault(); closeConversation(); return; }
    closeModal(); if(EDIT_MODE && ed.sel) select(null); return;
  }
  if(!EDIT_MODE || !ed.sel) return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;

  const isChar = ed.sel.type === 'char';
  const step = e.shiftKey ? 1 : 0.2;
  const target = isChar ? WORK.characters[ed.sel.id].position
                        : WORK.objects.find(o=>o.id===ed.sel.id).hotspot;
  let handled = true;

  switch(e.key){
    case 'ArrowLeft':  target.x = pct(num(target.x) - step); break;
    case 'ArrowRight': target.x = pct(num(target.x) + step); break;
    case 'ArrowUp':    target.y = pct(num(target.y) - step); break;
    case 'ArrowDown':  target.y = pct(num(target.y) + step); break;
    case '+': case '=': {
      const d = e.shiftKey ? 2 : 0.5;
      if(isChar){ const bottom = num(target.y)+num(target.h); target.h = pct(num(target.h)+d); target.y = pct(bottom-num(target.h)); }
      else target.h = pct(num(target.h)+d);
      break;
    }
    case '-': case '_': {
      const d = e.shiftKey ? 2 : 0.5;
      if(isChar){ const bottom = num(target.y)+num(target.h); target.h = pct(Math.max(3,num(target.h)-d)); target.y = pct(bottom-num(target.h)); }
      else target.h = pct(Math.max(1,num(target.h)-d));
      break;
    }
    case 'Delete': case 'Backspace': deleteSelection(); return;
    default: handled = false;
  }
  if(!handled) return;
  e.preventDefault();
  if(isChar) syncCharEl(ed.sel.id); else syncObjEl(ed.sel.id);
  positionChrome(); updateInspectorValues(); markDirty(true);
});

/* deselect on empty stage click */
el.stage.addEventListener('pointerdown', e => {
  if(!EDIT_MODE) return;
  if(e.target === el.stage || e.target === el.bg) select(null);
});

/* ---- baseline guide drag ---- */
(function(){
  let dragging = false;
  el.baseline.addEventListener('pointerdown', e => { dragging = true; e.preventDefault(); });
  window.addEventListener('pointermove', e => {
    if(!dragging) return;
    const s = stageRect();
    ed.baseline = clamp((e.clientY - s.top)/s.height*100, 0, 100);
    el.baseline.style.top = ed.baseline.toFixed(1)+'%';
    const tag = el.baseline.querySelector('.tag');
    if(tag) tag.textContent = 'floor line ' + ed.baseline.toFixed(1)+'%';
    saveDraft();
  });
  window.addEventListener('pointerup', () => { dragging = false; });
})();

/* ---- side panel ---- */
function renderPanel(){
  if(!EDIT_MODE) return;
  const activeRoom = state.roomId;
  const p = [];

  p.push('<div class="ed-sec"><h3>Scene editor<span class="ed-dirty-dot"></span></h3>'+
    '<div class="ed-row"><button class="ed-btn '+(ed.mode==='characters'?'active':'')+'" data-mode="characters">Characters</button>'+
    '<button class="ed-btn '+(ed.mode==='hotspots'?'active':'')+'" data-mode="hotspots">Hotspots</button></div></div>');

  /* rooms */
  p.push('<div class="ed-sec"><h3>Rooms</h3>');
  PORTAL_WORLD.rooms.forEach(r => {
    const n = charsInRoom(r.id).length + objsInRoom(r.id).length;
    p.push('<div class="ed-item '+(r.id===activeRoom?'active':'')+'" data-room="'+r.id+'">'+
      '<div class="ed-thumb" style="background-image:url(\''+r.image+'\')"></div>'+
      '<div class="meta"><div class="nm">'+esc(r.name)+'</div><div class="sub">'+n+' item'+(n===1?'':'s')+'</div></div></div>');
  });
  p.push('</div>');

  /* characters */
  p.push('<div class="ed-sec"><h3>Characters</h3>');
  Object.entries(PORTAL_WORLD.characters).forEach(([id,c]) => {
    const w = WORK.characters[id];
    let sub = '<div class="sub dim">not placed</div>';
    if(w.room === activeRoom) sub = '<div class="sub here">in this room</div>';
    else if(w.room) sub = '<div class="sub">in '+esc((getRoom(w.room)||{}).name || w.room)+'</div>';
    const isSel = ed.sel && ed.sel.type==='char' && ed.sel.id===id;
    p.push('<div class="ed-item '+(isSel?'active':'')+'" data-char="'+id+'">'+
      '<div class="ed-sprite-thumb"><img src="'+c.sprite+'" alt=""></div>'+
      '<div class="meta"><div class="nm">'+esc(c.name)+'</div>'+sub+'</div></div>');
  });
  p.push('</div>');

  /* objects (hotspots mode) */
  if(ed.mode === 'hotspots'){
    p.push('<div class="ed-sec"><h3>Objects</h3>');
    WORK.objects.forEach(o => {
      const isSel = ed.sel && ed.sel.type==='obj' && ed.sel.id===o.id;
      p.push('<div class="ed-item '+(isSel?'active':'')+'" data-obj="'+esc(o.id)+'">'+
        '<div class="meta"><div class="nm">'+esc(o.label || o.id)+'</div>'+
        '<div class="sub'+(o.room===activeRoom?' here':'')+'">'+esc((getRoom(o.room)||{}).name || o.room || '—')+'</div></div></div>');
    });
    p.push('<button class="ed-btn sm" id="ed-new-hotspot" style="margin-top:6px">+ New hotspot</button></div>');
  }

  /* inspector */
  p.push('<div class="ed-sec"><h3>Inspector</h3>'+inspectorHtml()+'</div>');

  /* helpers */
  p.push('<div class="ed-sec"><h3>Helpers</h3>'+
    '<div class="ed-row" style="margin-bottom:8px">'+
      '<button class="ed-btn sm '+(ed.guides?'active':'')+'" id="ed-guides">Guides</button>'+
      '<button class="ed-btn sm" id="ed-preview">Preview</button>'+
    '</div>'+
    '<div class="ed-field"><label>Opacity</label>'+
      '<input class="ed-slider" type="range" min="30" max="100" value="'+ed.opacity+'" id="ed-opacity" '+(ed.sel&&ed.sel.type==='char'?'':'disabled')+'></div>'+
    '<div class="ed-stats" id="ed-stats"></div></div>');

  /* save / export */
  p.push('<div class="ed-sec"><h3>Save</h3>'+
    '<div class="ed-row" style="margin-bottom:6px">'+
      '<button class="ed-btn sm" id="ed-copy">Copy JSON</button></div>'+
    '<div class="ed-row" style="margin-bottom:6px">'+
      '<button class="ed-btn sm" id="ed-download">Download world_data.js</button></div>'+
    '<div class="ed-row"><button class="ed-btn sm danger" id="ed-revert">Revert to saved</button></div>'+
    '<div class="ed-hint" style="margin-top:9px">Drafts autosave locally. Download replaces world_data.js in place, keeping all comments and other fields.</div>'+
    '</div>');

  el.panel.innerHTML = p.join('');
  wirePanel();
  updateStats(selPxBox());
}

function inspectorHtml(){
  if(!ed.sel) return '<div class="ed-hint">Nothing selected. Click a '+(ed.mode==='characters'?'character':'hotspot')+' on the stage, or pick one from the list above.</div>';

  if(ed.sel.type === 'char'){
    const w = WORK.characters[ed.sel.id];
    const p = w.position;
    const widthPct = (num(p.h) * (ASPECT[ed.sel.id]||0.35));
    return '<div class="ed-field"><label>X %</label><input type="number" step="0.1" id="f-x" value="'+num(p.x).toFixed(1)+'"></div>'+
      '<div class="ed-field"><label>Y %</label><input type="number" step="0.1" id="f-y" value="'+num(p.y).toFixed(1)+'"></div>'+
      '<div class="ed-field"><label>Height %</label><input type="number" step="0.1" id="f-h" value="'+num(p.h).toFixed(1)+'"></div>'+
      '<div class="ed-field"><label>Width %</label><input type="number" value="'+widthPct.toFixed(1)+'" disabled></div>'+
      '<div class="ed-field"><label>Z order</label><input type="number" step="1" id="f-z" value="'+(w.z||0)+'"></div>'+
      '<div class="ed-row" style="margin-bottom:7px">'+
        '<button class="ed-btn sm" id="ed-forward">Bring fwd</button>'+
        '<button class="ed-btn sm" id="ed-back">Send back</button></div>'+
      '<button class="ed-btn sm danger" id="ed-delete">Remove from room</button>'+
      '<div class="ed-hint" style="margin-top:8px">X is the sprite\u2019s centre, Y its top edge. Corner handles scale from the feet.</div>';
  }

  const o = WORK.objects.find(x => x.id === ed.sel.id);
  const r = o.hotspot;
  return '<div class="ed-field"><label>ID</label><input class="text" type="text" id="f-id" value="'+esc(o.id)+'"></div>'+
    '<div class="ed-field"><label>Label</label><input class="text" type="text" id="f-label" value="'+esc(o.label||'')+'"></div>'+
    '<div class="ed-field"><label>X %</label><input type="number" step="0.1" id="f-x" value="'+num(r.x).toFixed(1)+'"></div>'+
    '<div class="ed-field"><label>Y %</label><input type="number" step="0.1" id="f-y" value="'+num(r.y).toFixed(1)+'"></div>'+
    '<div class="ed-field"><label>Width %</label><input type="number" step="0.1" id="f-w" value="'+num(r.w).toFixed(1)+'"></div>'+
    '<div class="ed-field"><label>Height %</label><input type="number" step="0.1" id="f-h" value="'+num(r.h).toFixed(1)+'"></div>'+
    '<button class="ed-btn sm danger" id="ed-delete">Delete hotspot</button>';
}

function updateInspectorValues(){
  if(!ed.sel) return;
  const set = (id,v) => { const n = document.getElementById(id); if(n && document.activeElement !== n) n.value = v; };
  if(ed.sel.type === 'char'){
    const p = WORK.characters[ed.sel.id].position;
    set('f-x', num(p.x).toFixed(1)); set('f-y', num(p.y).toFixed(1)); set('f-h', num(p.h).toFixed(1));
  } else {
    const r = WORK.objects.find(o=>o.id===ed.sel.id).hotspot;
    set('f-x', num(r.x).toFixed(1)); set('f-y', num(r.y).toFixed(1));
    set('f-w', num(r.w).toFixed(1)); set('f-h', num(r.h).toFixed(1));
  }
}

function wirePanel(){
  const $ = id => document.getElementById(id);
  const on = (id, ev, fn) => { const n = $(id); if(n) n.addEventListener(ev, fn); };

  el.panel.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    ed.mode = b.dataset.mode; ed.sel = null;
    document.body.classList.toggle('mode-hotspots', ed.mode==='hotspots');
    document.body.classList.toggle('mode-characters', ed.mode==='characters');
    renderRoom();
  }));

  el.panel.querySelectorAll('[data-room]').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.room === state.roomId) return;
    state.roomId = b.dataset.room; ed.sel = null; renderRoom();
  }));

  el.panel.querySelectorAll('[data-char]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.char, w = WORK.characters[id];
    if(w.room !== state.roomId){
      w.room = state.roomId;
      w.position = {...DEFAULT_CHAR_POS};
      markDirty(true);
      ed.mode = 'characters';
      document.body.classList.add('mode-characters');
      document.body.classList.remove('mode-hotspots');
      ed.sel = {type:'char', id};
      renderRoom();
    } else {
      ed.mode = 'characters';
      document.body.classList.add('mode-characters');
      document.body.classList.remove('mode-hotspots');
      select('char', id);
    }
  }));

  el.panel.querySelectorAll('[data-obj]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.obj, o = WORK.objects.find(x=>x.id===id);
    if(o.room !== state.roomId){ state.roomId = o.room; ed.sel = {type:'obj', id}; renderRoom(); }
    else select('obj', id);
  }));

  on('ed-new-hotspot','click', () => {
    let n = 1; while(WORK.objects.some(o => o.id === 'new_hotspot_'+n)) n++;
    const id = 'new_hotspot_'+n;
    WORK.objects.push({ id, room:state.roomId, label:'New hotspot', text:'', isNew:true,
                        hotspot:{x:"45%",y:"45%",w:"10%",h:"10%"} });
    ed.sel = {type:'obj', id};
    markDirty(true); renderRoom(); updateClueCounter();
  });

  /* inspector fields */
  const fieldCommit = () => {
    if(!ed.sel) return;
    if(ed.sel.type === 'char'){
      const p = WORK.characters[ed.sel.id].position;
      const x = $('f-x'), y = $('f-y'), h = $('f-h'), z = $('f-z');
      if(x) p.x = pct(num(x.value)); if(y) p.y = pct(num(y.value));
      if(h) p.h = pct(Math.max(3, num(h.value)));
      if(z) WORK.characters[ed.sel.id].z = parseInt(z.value,10) || 0;
      syncCharEl(ed.sel.id);
    } else {
      const o = WORK.objects.find(x2=>x2.id===ed.sel.id);
      const x = $('f-x'), y = $('f-y'), w = $('f-w'), h = $('f-h'), lb = $('f-label'), idf = $('f-id');
      if(x) o.hotspot.x = pct(num(x.value)); if(y) o.hotspot.y = pct(num(y.value));
      if(w) o.hotspot.w = pct(Math.max(1,num(w.value))); if(h) o.hotspot.h = pct(Math.max(1,num(h.value)));
      if(lb) o.label = lb.value;
      if(idf && idf.value.trim() && idf.value !== o.id){
        const nid = idf.value.trim();
        if(!WORK.objects.some(z2 => z2.id === nid)){ o.id = nid; ed.sel = {type:'obj', id:nid}; }
      }
      syncObjEl(o.id);
    }
    markDirty(true); positionChrome();
  };
  ['f-x','f-y','f-w','f-h','f-z','f-label','f-id'].forEach(id => {
    on(id,'input', fieldCommit);
    on(id,'change', () => { fieldCommit(); renderRoom(); });
  });

  on('ed-forward','click', () => { bumpZ(1); });
  on('ed-back','click', () => { bumpZ(-1); });
  on('ed-delete','click', deleteSelection);

  on('ed-guides','click', () => {
    ed.guides = !ed.guides;
    document.body.classList.toggle('guides-on', ed.guides);
    el.baseline.style.top = ed.baseline.toFixed(1)+'%';
    renderPanel();
  });

  on('ed-preview','pointerdown', e => {
    e.preventDefault();
    const t0 = Date.now();
    document.body.classList.add('previewing');
    const release = () => {
      window.removeEventListener('pointerup', release);
      const held = Date.now() - t0;
      /* a tap gives a timed 3s look; a hold restores as soon as released */
      setTimeout(() => document.body.classList.remove('previewing'), held < 300 ? 3000 - held : 0);
    };
    window.addEventListener('pointerup', release);
  });

  on('ed-opacity','input', e => {
    ed.opacity = +e.target.value;
    if(ed.sel && ed.sel.type === 'char'){
      const n = el.sprites.querySelector('[data-char-id="'+ed.sel.id+'"]');
      if(n) n.style.opacity = ed.opacity/100;   /* visual aid only, never exported */
    }
  });

  on('ed-copy','click', async () => {
    const payload = JSON.stringify(exportPayload(), null, 2);
    try{ await navigator.clipboard.writeText(payload); flash('ed-copy','Copied'); }
    catch(e){ showModal('<div class="eyebrow">Copy JSON</div><h2>Clipboard blocked</h2><div class="maroon-rule"></div><p>'+esc(payload)+'</p>'); }
  });
  on('ed-download','click', downloadWorldData);
  on('ed-revert','click', () => {
    WORK = buildWork();
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    ed.sel = null; markDirty(false); renderRoom(); updateClueCounter();
  });
}

function bumpZ(dir){
  if(!ed.sel || ed.sel.type !== 'char') return;
  const list = charsInRoom(state.roomId).map(([id]) => id);
  const i = list.indexOf(ed.sel.id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= list.length) return;
  /* rewrite z as a clean sequence with the two swapped */
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((id,k) => { WORK.characters[id].z = k; });
  markDirty(true); renderRoom();
}

function flash(btnId, text){
  const b = document.getElementById(btnId); if(!b) return;
  const old = b.textContent; b.textContent = text;
  setTimeout(() => { b.textContent = old; }, 1200);
}

/* ---- export ---- */
function exportPayload(){
  return {

/* Patch the real source text so every comment and unrelated field survives. */
async function downloadWorldData(){
  let src;
  try{
    const res = await fetch('world_data.js', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    src = await res.text();
  }catch(err){
    showModal('<div class="eyebrow">Download</div><h2>Cannot read world_data.js</h2><div class="maroon-rule"></div>'+
      '<p>The patcher needs to fetch the original file, which the browser blocks on file:// URLs. '+
      'Serve the folder over http (for example: python -m http.server) and try again, or use Copy JSON.</p>');
    return;
  }

  let failed = [];

  /* Ids repeat across the file (e.g. "tornphoto" is both an object id and a key
     in Naina's `topics`). Patching against the whole file lets one entry's regex
     run forward into another's block, so each patch is scoped to its own region. */
  function blockRange(text, keyRe, open, close){
    const m = keyRe.exec(text);
    if(!m) return null;
    const start = text.indexOf(open, m.index);
    if(start < 0) return null;
    let depth = 0;
    for(let i = start; i < text.length; i++){
      if(text[i] === open) depth++;
      else if(text[i] === close){ depth--; if(depth === 0) return {start, end:i+1}; }
    }
    return null;
  }
  function patchRegion(text, range, fn){
    if(!range) return text;
    return text.slice(0, range.start) + fn(text.slice(range.start, range.end)) + text.slice(range.end);
  }

  let out = src;

  /* ---- characters: patch inside the characters:{...} block only ---- */
  const charsRange = blockRange(out, /characters\s*:\s*\{/, '{', '}');
  if(!charsRange) failed.push('characters block');
  out = patchRegion(out, charsRange, block => {
    Object.entries(WORK.characters).forEach(([id,c]) => {
      /* scope again to this one character's own sub-block */
      const own = blockRange(block, new RegExp('(?:^|\\n)\\s{4}'+id+'\\s*:\\s*\\{'), '{', '}')
               || blockRange(block, new RegExp('\\b'+id+'\\s*:\\s*\\{'), '{', '}');
      if(!own){ failed.push(id+' block'); return; }
      block = patchRegion(block, own, sub => {
        const posLit = '{ x:"'+c.position.x+'", y:"'+c.position.y+'", h:"'+c.position.h+'" }';
        const posRe = /(position:\s*)\{[^}]*\}(\s*,\s*z:\s*-?\d+)?/;
        if(posRe.test(sub)) sub = sub.replace(posRe, (m,pre) => pre + posLit + (c.z ? ', z: '+c.z : ''));
        else failed.push(id+'.position');
        const roomRe = /(\n\s*room:\s*)("[^"]*"|null)/;
        if(roomRe.test(sub)) sub = sub.replace(roomRe, (m,pre) => pre + (c.room ? '"'+c.room+'"' : 'null'));
        else failed.push(id+'.room');
        return sub;
      });
    });
    return block;
  });

  /* ---- objects: patch inside the objects:[...] array only ---- */
  const origIds = new Set(PORTAL_WORLD.objects.map(o => o.id));
  const objRange = blockRange(out, /objects\s*:\s*\[/, '[', ']');
  if(!objRange) failed.push('objects block');
  out = patchRegion(out, objRange, block => {
    WORK.objects.filter(o => origIds.has(o.id)).forEach(o => {
      const lit = '{x:"'+o.hotspot.x+'",y:"'+o.hotspot.y+'",w:"'+o.hotspot.w+'",h:"'+o.hotspot.h+'"}';
      /* require the id to be immediately followed by room:, which only object literals are */
      const re = new RegExp('(id:"'+o.id+'"\\s*,\\s*room:"[^"]*"[\\s\\S]*?hotspot:\\s*)\\{[^}]*\\}');
      if(re.test(block)) block = block.replace(re, (m,pre) => pre + lit);
      else failed.push(o.id+'.hotspot');
    });
    return block;
  });

  /* objects deleted in the editor */
  const keptIds = new Set(WORK.objects.map(o => o.id));
  const removed = PORTAL_WORLD.objects.filter(o => !keptIds.has(o.id)).map(o => o.id);

  /* brand-new objects: append inside the objects array, before its closing bracket */
  const added = WORK.objects.filter(o => !origIds.has(o.id));
  if(added.length){
    const lits = added.map(o =>
      '\n    { id:"'+o.id+'", room:"'+o.room+'", label:'+JSON.stringify(o.label||o.id)+
      ', hotspot:{x:"'+o.hotspot.x+'",y:"'+o.hotspot.y+'",w:"'+o.hotspot.w+'",h:"'+o.hotspot.h+'"},'+
      '\n      text:'+JSON.stringify(o.text||"")+',\n      clue:"", foreshadow:false }'
    ).join(',');
    const r2 = blockRange(out, /objects\s*:\s*\[/, '[', ']');
    if(r2) out = out.slice(0, r2.end-1).replace(/,?\s*$/, '') + ',' + lits + '\n  ' + out.slice(r2.end-1);
    else failed.push('new objects');
  }

  const blob = new Blob([out], {type:'text/javascript'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'world_data.js';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);

  let msg = '<p>world_data.js downloaded with your positions patched in. Every comment and unrelated field is preserved.</p>';
  if(removed.length) msg += '<p><b>Note:</b> deleted hotspots ('+esc(removed.join(', '))+') were left in the file \u2014 remove them by hand if you meant to drop them.</p>';
  if(failed.length) msg += '<p><b>Could not patch:</b> '+esc(failed.join(', '))+'. Check those by hand.</p>';
  showModal('<div class="eyebrow">Export</div><h2>Saved</h2><div class="maroon-rule"></div>'+msg);
  markDirty(false);
}

/* ---- draft restore ---- */
function maybeRestoreDraft(){
  let draft = null;
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) draft = JSON.parse(raw); }catch(e){}
  if(!draft || !draft.work) return false;
  if(!confirm('A saved editor draft was found. Restore it?\n\nCancel loads the positions currently in world_data.js.')){
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    return false;
  }
  WORK = draft.work;
  if(typeof draft.baseline === 'number') ed.baseline = draft.baseline;
  markDirty(true);
  return true;
}

function escSql(value){ return String(value == null ? '' : value).replace(/'/g,"''"); }
function dbxRecord(event){
  return {event_id:(crypto.randomUUID?crypto.randomUUID():DBX_SESSION_ID+'-'+Date.now()),session_id:DBX_SESSION_ID,type:event.type,
    character:event.character||'',topic:event.topic||event.topicTag||'',free_text:event.freeText||event.question||event.text||'',
    answer_type:event.answerType||'',object_id:event.object||'',value:JSON.stringify(event),ts:event.ts};
}
function queueDatabricksEvent(event){
  if(!DBX.enabled) return; dbxQueue.push(dbxRecord(event));
  if(dbxQueue.length>=20) flushDatabricks();
  else if(!dbxFlushTimer) dbxFlushTimer=setTimeout(flushDatabricks,10000);
}
function flushDatabricks(){
  if(dbxFlushTimer){clearTimeout(dbxFlushTimer);dbxFlushTimer=null;}
  if(!DBX.enabled || !dbxQueue.length) return;
  const batch=dbxQueue.splice(0,20);
  const values=batch.map(r=>"('"+[r.event_id,r.session_id,r.type,r.character,r.topic,r.free_text,r.answer_type,r.object_id,r.value].map(escSql).join("','")+"',TIMESTAMP '"+escSql(r.ts).replace('T',' ').replace('Z','')+"')").join(',');
  const statement='INSERT INTO '+DBX.table+' (event_id,session_id,type,character,topic,free_text,answer_type,object_id,value,ts) VALUES '+values;
  fetch(DBX.proxy,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({warehouse_id:DBX.warehouseId,statement,wait_timeout:'10s'})})
    .then(r=>{if(!r.ok) throw Error('proxy'); return r.json();}).then(()=>{dbxConnected=true;if(document.body.classList.contains('writer-studio-open'))renderWriterStudio();})
    .catch(()=>{dbxConnected=false;dbxQueue.unshift(...batch);if(document.body.classList.contains('writer-studio-open'))renderWriterStudio();});
}
async function dbxStatement(statement){
  const res=await fetch(DBX.proxy,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({warehouse_id:DBX.warehouseId,statement,wait_timeout:'10s'})});
  if(!res.ok) throw Error('Databricks unavailable'); const data=await res.json(); dbxConnected=true; return data;
}

function boot(){
  el.title.textContent = PORTAL_WORLD.title;
  el.subtitle.textContent = PORTAL_WORLD.subtitle;
  preloadAll();

  if(EDIT_MODE){
    document.body.classList.add('edit-mode','mode-characters');
    maybeRestoreDraft();
    el.baseline.style.top = ed.baseline.toFixed(1)+'%';
    window.addEventListener('resize', () => positionChrome());
  }
  updateClueCounter();
  startCountdown();
  startPresence();
  el.writerStudioToggle.addEventListener('click',toggleWriterStudio);
  renderRoom();
  if(!EDIT_MODE) showEntryCard();
}

function portalStopAudio(){

  try{ if(typeof activeObjectAudio!=='undefined'&&activeObjectAudio){activeObjectAudio.pause();activeObjectAudio=null;} }catch(e){}
}
window.PocketPortal={
  open(episodeNumber){ portalEpisodeNumber=Number(episodeNumber)||2; portalIsOpen=true; portalStopAudio(); renderRoom(); showEntryCard(); },
